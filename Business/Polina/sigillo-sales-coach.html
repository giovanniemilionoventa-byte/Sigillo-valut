{ id:"javier", name:"Javier Ortega", initials:"JO", color:"#ef6c00", stars:2, adj:0, flag:"🇪🇸",
  role:_("Freelance AI developer, Valencia","Sviluppatore AI freelance, Valencia"),
  icp:_("Freelancer · finance agent for one accounting firm","Freelance · agente per la finanza per uno studio di commercialisti"),
  plan:_("Free trial → Starter €49","Prova gratuita → Starter 49 €"),
  personality:_("Relaxed, curious, jokes a lot. Very technical.","Rilassato, curioso, scherza molto. Molto tecnico."),
  fears:_("Losing time, complexity, paying for something his client never asked for.","Perdere tempo, complicazioni, pagare qualcosa che il suo cliente non ha mai chiesto."),
  wants:_("A selling point to charge his client more.","Un argomento per farsi pagare di più dal cliente."),
  intro:_("Javier works alone. He built an AI assistant for a small accounting firm: it reads invoices and prepares tax entries. You met him at a meetup and he said \"call me\".",
          "Javier lavora da solo. Ha costruito un assistente AI per un piccolo studio di commercialisti: legge le fatture e prepara le registrazioni fiscali. L'hai conosciuto a un incontro e ti ha detto \"chiamami\"."),
  outcomes:{ sale:_("Javier signs up for the free trial and connects his agent the same day. He'll move to Starter when his client goes live.","Javier si iscrive alla prova gratuita e collega l'agente lo stesso giorno. Passerà allo Starter quando il suo cliente va in produzione."),
             demo:_("Javier says he'll try \"when he has time\". Send a reminder next week.","Javier dice che proverà \"quando ha tempo\". Mandagli un promemoria la settimana prossima."),
             lost:_("Javier decides to build his own \"quick version\".","Javier decide di farsi una sua \"versione veloce\".") },
  lesson:_("Developers respect honesty about technical limits and hate being told what they can't do. Show them how Sigillo makes them money.","Gli sviluppatori rispettano l'onestà sui limiti tecnici e odiano sentirsi dire cosa non sanno fare. Mostra come Sigillo li fa guadagnare."),
  nodes:[
  { say:_("¡Hola! I'm a one-man shop. Honestly, my client never asked for anything like this. Why should I care?","¡Hola! Lavoro da solo. Sinceramente il mio cliente non mi ha mai chiesto niente del genere. Perché dovrebbe interessarmi?"),
    tip:_("For a freelancer, Sigillo is a selling point and extra revenue.","Per un freelance, Sigillo è un argomento di vendita e un guadagno in più."),
    opts:[
      O("Because you can sell it. Your client is an accountant: if the agent ever gets a number wrong, they'll want to know exactly what happened. Add \"every action of the agent is sealed and checkable\" to your offer, and charge for it.",
        "Perché lo puoi vendere. Il tuo cliente è un commercialista: se l'agente sbaglia un numero, vorrà sapere esattamente cos'è successo. Aggiungi \"ogni azione dell'agente è sigillata e controllabile\" alla tua offerta, e fattela pagare.",
        12,"For a freelancer, Sigillo is a selling point and extra revenue. Speak to that.","Per un freelance Sigillo è un argomento di vendita e un guadagno. Parla di questo.",
        "Ha, now you speak my language: money.","Ah, ora parli la mia lingua: i soldi."),
      O("Because the AI Act will fine you.","Perché l'AI Act ti farà la multa.",
        -5,"Fear without facts. You can't tell him exactly how the AI Act applies to his case.","Paura senza fatti. Non sai dirgli esattamente come si applica l'AI Act al suo caso.",
        "Will it? To me? Explain.","Davvero? A me? Spiegami."),
      O("It's good practice to record what AI agents do.","È buona pratica registrare cosa fanno gli agenti AI.",
        4,"True but weak. Show how it makes him money.","Vero ma debole. Mostra come lo fa guadagnare.",
        "Sure, so is flossing.","Certo, anche usare il filo interdentale."),
      O("Every serious developer already uses it.","Tutti gli sviluppatori seri lo usano già.",
        -10,"Not true, and he'll know it. Never invent popularity.","Non è vero, e lo sa. Non inventare mai la popolarità.",
        "Really? I've never heard of it.","Davvero? Non l'ho mai sentito.", {red:true})
    ]},
  { say:_("How long does it take to set up? I bill by the hour, ha.","Quanto ci vuole per installarlo? Io mi faccio pagare a ore, ah."),
    tip:_("3 lines of Python + 20-minute call. Python only today.","3 righe di Python + chiamata di 20 minuti. Oggi solo Python."),
    opts:[
      O("Three lines of Python at the top of the agent. We connect the first one together in 20 minutes. Then it works by itself.","Tre righe di Python in cima all'agente. Il primo lo colleghiamo insieme in 20 minuti. Poi va da solo.",
        12,"Concrete and true.","Concreta e vera.",
        "Three lines. Even I can do that before lunch.","Tre righe. Ce la faccio anche prima di pranzo."),
      O("A few days, maybe.","Qualche giorno, forse.",
        -5,"Wrong, it's much less. You just made it sound expensive.","Sbagliato, è molto meno. L'hai fatto sembrare costoso.",
        "Days? Hmm.","Giorni? Mmh."),
      O("It's quick, there's a guide.","È veloce, c'è una guida.",
        4,"OK, but the numbers (three lines, 20 minutes) sell.","Va bene, ma i numeri (tre righe, 20 minuti) vendono.",
        "How quick?","Quanto veloce?"),
      O("No setup at all, it works with any agent in any language.","Nessuna installazione, funziona con qualsiasi agente in qualsiasi linguaggio.",
        -11,"Python only, today. He's a developer: he'll find out in minutes.","Oggi solo Python. È uno sviluppatore: lo scopre in pochi minuti.",
        "Any language without setup? That's… magic. I don't believe in magic.","Qualsiasi linguaggio senza installazione? È… magia. Io non credo alla magia.", {red:true})
    ]},
  { say:_("My agent sometimes makes things up. If the AI lies, can Sigillo tell?","Il mio agente a volte si inventa le cose. Se l'AI mente, Sigillo se ne accorge?"),
    tip:_("Sigillo doesn't check truth. It proves what was said; the AI can't switch it off.","Sigillo non controlla la verità. Prova cosa è stato detto; l'AI non può spegnerlo."),
    opts:[
      O("No, Sigillo doesn't check if the AI is right. It records what the AI said and did, sealed. And the AI can't switch it off: Sigillo isn't in the prompt, it's code in your program. So if the AI says something wrong, the proof of what it said is there.",
        "No, Sigillo non controlla se l'AI ha ragione. Registra cosa ha detto e fatto, sigillato. E l'AI non lo può spegnere: Sigillo non è nel prompt, è codice nel tuo programma. Quindi se l'AI dice una cosa sbagliata, la prova di cosa ha detto c'è.",
        13,"Clear limit, then the value: the AI can't hide its own mistakes.","Limite chiaro, poi il valore: l'AI non può nascondere i suoi errori.",
        "Makes sense. It's a black box recorder, not a lie detector.","Ha senso. È una scatola nera, non una macchina della verità."),
      O("Yes, Sigillo detects when the AI lies.","Sì, Sigillo scopre quando l'AI mente.",
        -14,"False. Sigillo proves what was said, not whether it was true.","Falso. Sigillo prova cosa è stato detto, non se era vero.",
        "If you can detect AI lies, you should sell that to OpenAI.","Se sapete scoprire le bugie dell'AI, vendetelo a OpenAI.", {red:true}),
      O("That's a problem of the model, not ours.","È un problema del modello, non nostro.",
        3,"True but unhelpful. Explain that the AI cannot hide what it said.","Vero ma poco utile. Spiega che l'AI non può nascondere cosa ha detto.",
        "OK, but then what do you give me?","Ok, ma allora cosa mi date?"),
      O("Just use a better model.","Usa un modello migliore.",
        -5,"Not your job, and it dodges his question.","Non è il tuo lavoro, ed eviti la sua domanda.",
        "Thanks, very helpful.","Grazie, utilissimo.")
    ]},
  { say:_("Can't I just build this myself? Hash the logs, done.","Non posso farmelo da solo? Faccio l'hash dei log, fatto."),
    tip:_("Respect his skill. The point is independence: proof from a third party.","Rispetta la sua bravura. Il punto è l'indipendenza: la prova di un terzo."),
    opts:[
      O("You could build part of it. But then the proof comes from you, and the accountant's auditor has to trust you. With Sigillo it's sealed by a third party, stamped every hour by an outside company, and checked with an independent verifier. And you save weeks for €49 a month.",
        "Una parte potresti farla. Ma allora la prova viene da te, e il revisore del commercialista deve fidarsi di te. Con Sigillo è sigillata da un terzo, timbrata ogni ora da un'azienda esterna e controllata con un verificatore indipendente. E risparmi settimane per 49 € al mese.",
        12,"You respect his skill; the point is independence (and his time).","Rispetti la sua bravura; il punto è l'indipendenza (e il suo tempo).",
        "True… proof from myself about myself isn't worth much.","Vero… una prova fatta da me su me stesso vale poco."),
      O("No, it's too hard for you.","No, è troppo difficile per te.",
        -7,"Never question a developer's skills. You lose him.","Non mettere mai in dubbio la bravura di uno sviluppatore. Lo perdi.",
        "Excuse me?","Prego?"),
      O("Sure, but it takes time.","Certo, ma ci vuole tempo.",
        4,"Partly right. The bigger reason: proof from a third party is worth more than proof from yourself.","In parte giusto. Il motivo più grande: la prova di un terzo vale più della propria.",
        "I have weekends.","Ho i fine settimana.")
    ]},
  { say:_("What's the price for a tiny guy like me?","Che prezzo fate a uno piccolo come me?"),
    tip:_("Free trial, then Starter €49. He can resell it.","Prova gratuita, poi Starter 49 €. Lo può rivendere."),
    opts:[
      O("Free to start: 1 agent, 5,000 records a month. When your client's agent is live, Starter is €49 a month, or €490 a year. You can add it to your client's price.","Si parte gratis: 1 agente, 5.000 ricevute al mese. Quando l'agente del cliente è in produzione, Starter a 49 € al mese, o 490 € all'anno. Puoi metterlo nel prezzo al cliente.",
        12,"Free start, clear next step, resale idea.","Inizio gratis, passo successivo chiaro, idea di rivendita.",
        "Free, then my client pays. I like this plan.","Gratis, poi paga il cliente. Mi piace."),
      O("Professional, €149 a month.","Il Professionale, 149 € al mese.",
        -6,"Too big for one agent. Match the plan to the client.","Troppo per un agente. Scegli il piano giusto per il cliente.",
        "For one agent? Too much.","Per un agente? Troppo."),
      O("It depends on usage.","Dipende dall'uso.",
        3,"Give the numbers; they're simple.","Di' i numeri; sono semplici.",
        "Give me a number.","Dammi un numero.")
    ]},
  { hardOnly:true,
    say:_("And if my client wants to show the record to their auditor? Do I give them access to my server?","E se il mio cliente vuole mostrare il registro al suo revisore? Gli do l'accesso al mio server?"),
    tip:_("Reviewer link: read-only, one agent and period, 30 days, Verify here / Download.","Link per il revisore: solo lettura, un agente e un periodo, 30 giorni, Verifica qui / Scarica."),
    opts:[
      O("No. You press \"Share with reviewer\" and send a link. The auditor clicks \"Verify here\" to check in the browser, or \"Download\" to check with the free verifier. Read-only, only that agent and those dates, expires after 30 days.",
        "No. Premi \"Condividi con il revisore\" e mandi un link. Il revisore preme \"Verifica qui\" per controllare nel browser, o \"Scarica\" per controllare con il verificatore gratuito. Solo lettura, solo quell'agente e quelle date, scade dopo 30 giorni.",
        12,"The reviewer link, exactly.","Il link per il revisore, esattamente.",
        "Nice, no passwords flying around.","Bene, niente password in giro."),
      O("Just give them your Sigillo password.","Dagli la tua password di Sigillo.",
        -8,"Never. The reviewer link exists so nobody shares passwords.","Mai. Il link per il revisore esiste proprio per non condividere password.",
        "My password? Seriously?","La mia password? Sul serio?"),
      O("They download a zip file.","Scaricano un file zip.",
        3,"True, but the link is simpler and stronger.","Vero, ma il link è più semplice e più forte.",
        "From where?","Da dove?")
    ]},
  { closing:true,
    say:_("OK, I'm curious. What do I do?","Ok, sono curioso. Cosa faccio?"),
    tip:_("Free trial today, three lines, optional 20-minute call.","Prova gratuita oggi, tre righe, chiamata di 20 minuti se vuole."),
    opts:[
      O("Sign up for the free trial today and put the three lines in your agent. If you like, I'll book 20 minutes with our tech lead to connect it together.","Iscriviti oggi alla prova gratuita e metti le tre righe nell'agente. Se vuoi, fisso 20 minuti con il nostro responsabile tecnico per collegarlo insieme.",
        8,"Free, immediate, concrete.","Gratis, immediato, concreto.",
        "Doing it tonight.","Lo faccio stasera.", {c:"ask"}),
      O("Pay for the year now, you save 2 months.","Paga l'anno adesso, risparmi 2 mesi.",
        -8,"He hasn't even tried. Free trial first.","Non l'ha nemmeno provato. Prima la prova gratuita.",
        "Slow down, amigo.","Piano, amiga.", {c:"push"}),
      O("Follow us on LinkedIn.","Seguici su LinkedIn.",
        1,"Not a next step.","Non è un passo successivo.",
        "Sure…","Certo…", {c:"soft"})
    ]}
  ]},

/* ======================= ELENA ======================= */
{ id:"elena", name:"Dott.ssa Elena Ferri", initials:"EF", color:"#6a1b9a", stars:4, adj:-5, flag:"🇮🇹",
  role:_("Head of Compliance, Assicurazioni Lario (insurer), Como","Responsabile Conformità, Assicurazioni Lario, Como"),
  icp:_("End client · insurer","Cliente finale · assicurazione"),
  plan:_("Regulated, from €390/month (pilot first)","Regolato, da 390 €/mese (prima un pilota)"),
  personality:_("Formal, skeptical, slow. Writes everything down.","Formale, scettica, lenta. Scrive tutto."),
  fears:_("Legal value of the proof, trusting a small supplier, audits by the regulator, data outside the EU.","Valore legale della prova, fidarsi di un fornitore piccolo, controlli dell'autorità, dati fuori dall'UE."),
  wants:_("Evidence that holds up, a contract, a DPA, someone to call during an audit.","Prove che reggono, un contratto, un DPA, qualcuno da chiamare durante un audit."),
  intro:_("The software house that builds the insurer's claims agent gave her your name. She is polite but cold, with a notebook and a list of questions.",
          "La software house che costruisce l'agente per i sinistri dell'assicurazione le ha dato il tuo nome. È cortese ma fredda, con un quaderno e una lista di domande."),
  outcomes:{ sale:_("Dott.ssa Ferri agrees to a 3-month pilot with her supplier and asks for the DPA. A big win with an insurer.","La Dott.ssa Ferri accetta un pilota di 3 mesi con il suo fornitore e chiede il DPA. Una grande vittoria con un'assicurazione."),
             demo:_("She asks for a technical demo with her supplier first. Slow, but alive.","Chiede prima una demo tecnica con il suo fornitore. Lento, ma ancora vivo."),
             lost:_("She thanks you politely. You never hear from her again.","Ti ringrazia con cortesia. Non la senti più.") },
  lesson:_("Compliance people buy honesty about limits, documents (DPA, contract) and a defined pilot. Any overpromise ends the conversation.","Chi si occupa di conformità compra onestà sui limiti, documenti (DPA, contratto) e un pilota definito. Ogni promessa eccessiva chiude la conversazione."),
  nodes:[
  { say:_("Good morning. Our supplier uses AI agents on our claims. Why should I, in compliance, care about your product?","Buongiorno. Il nostro fornitore usa agenti AI sui nostri sinistri. Perché io, dalla conformità, dovrei interessarmi al vostro prodotto?"),
    tip:_("Start from her risk (a questioned decision), then the proof.","Parti dal suo rischio (una decisione contestata), poi la prova."),
    opts:[
      O("Because when a claim decision is questioned, by a customer or by the regulator, you'll need to show what the agent did and when. Sigillo keeps a sealed record of every agent action, time-stamped every hour by an outside company, and your auditors can check it themselves without trusting us.",
        "Perché quando una decisione su un sinistro viene contestata, da un cliente o dall'autorità, dovrete mostrare cosa ha fatto l'agente e quando. Sigillo tiene un registro sigillato di ogni azione dell'agente, timbrato ogni ora da un'azienda esterna, e i vostri revisori lo controllano da soli senza fidarsi di noi.",
        12,"Starts from her risk, then the proof. Her language.","Parte dal suo rischio, poi la prova. La sua lingua.",
        "Go on. (She writes something down.)","Prosegua. (Scrive qualcosa.)"),
      O("Because AI is the future and you need to be ready.","Perché l'AI è il futuro e dovete essere pronti.",
        -6,"Generic. Compliance wants specific risks and specific evidence.","Generica. La conformità vuole rischi precisi e prove precise.",
        "That is not an answer.","Questa non è una risposta."),
      O("Because with Sigillo you'll be certified for the AI Act.","Perché con Sigillo sarete certificati per l'AI Act.",
        -14,"\"Certified\" is forbidden and false. A compliance head stops trusting you immediately.","\"Certificati\" è vietato e falso. Una responsabile conformità smette subito di fidarsi.",
        "Certified by whom, exactly?","Certificati da chi, esattamente?", {red:true}),
      O("Because the AI Act asks to keep records of AI systems.","Perché l'AI Act chiede di tenere registrazioni dei sistemi AI.",
        5,"Right direction, but connect it to her daily risk: a questioned claim.","Direzione giusta, ma collegala al suo rischio di tutti i giorni: un sinistro contestato.",
        "I know what the AI Act says. What do you add?","So cosa dice l'AI Act. Voi cosa aggiungete?")
    ]},
  { say:_("You are a small company. Who guarantees that you don't change the records yourselves?","Siete una realtà piccola. Chi garantisce che non modifichiate voi i registri?"),
    tip:_("Turn \"trust us\" into \"check us\": outside hourly stamp + independent verifier.","Trasforma \"fidatevi\" in \"controllateci\": marca oraria esterna + verificatore indipendente."),
    opts:[
      O("Good question, and the design answers it: you don't have to trust us. Every hour an outside company stamps the diary, and your auditor checks the proof file with a free, independent program. If we changed even one line afterwards, the check would fail.",
        "Ottima domanda, e la risposta è nel progetto: non dovete fidarvi di noi. Ogni ora un'azienda esterna timbra il diario, e il vostro revisore controlla il fascicolo con un programma gratuito e indipendente. Se cambiassimo anche una sola riga dopo, il controllo fallirebbe.",
        14,"Turns \"trust us\" into \"check us\". The core of Sigillo.","Trasforma \"fidatevi\" in \"controllateci\". Il cuore di Sigillo.",
        "Hm. That is a better answer than I expected.","Mmh. È una risposta migliore di quanto mi aspettassi."),
      O("We are honest people, you can trust us.","Siamo persone oneste, può fidarsi.",
        -12,"Trust is exactly what she doesn't want to give. Sigillo's point is you don't need to.","La fiducia è proprio ciò che non vuole dare. Il punto di Sigillo è che non serve.",
        "Everyone says that.","Lo dicono tutti."),
      O("We use very strong cryptography.","Usiamo una crittografia molto forte.",
        4,"True but abstract. Say what she can do: her auditor checks it alone, with a free tool.","Vero ma astratto. Di' cosa può fare lei: il suo revisore controlla da solo, con uno strumento gratuito.",
        "Meaning what, for me?","Che per me significa?"),
      O("Nobody can change anything, the system is tamper-proof.","Nessuno può cambiare niente, il sistema è tamper-proof.",
        -10,"Forbidden word. Say \"tamper-evident\": any change shows.","Parola vietata. Di' \"tamper-evident\": ogni modifica si vede.",
        "Nothing is tamper-proof.","Niente è tamper-proof.", {red:true})
    ]},
  { say:_("Is your time stamp valid in court? Is it eIDAS qualified?","La vostra marca temporale vale in tribunale? È qualificata eIDAS?"),
    tip:_("Today: not qualified (still evidence, judge weighs it). Planned for paid plans. No date.","Oggi: non qualificata (comunque prova, la valuta il giudice). Prevista nei piani a pagamento. Nessuna data."),
    opts:[
      O("Today our hourly stamp comes from outside companies, but it's not the qualified eIDAS kind: it is still evidence, but a judge weighs it freely. We plan to include a qualified eIDAS stamp in the paid plans; then date and integrity get the legal presumption in the whole EU. I'll confirm timing with our technical lead before promising anything.",
        "Oggi la nostra marca oraria viene da aziende esterne, ma non è di tipo qualificato eIDAS: è comunque una prova, che il giudice valuta liberamente. Prevediamo di includere una marca qualificata eIDAS nei piani a pagamento; allora data e integrità avranno la presunzione legale in tutta l'UE. Confermo i tempi con il nostro responsabile tecnico prima di promettere qualcosa.",
        14,"Exactly honest: what exists, what is planned, no date promised. She respects this.","Esattamente onesta: cosa c'è, cosa è previsto, nessuna data promessa. Lei lo rispetta.",
        "Thank you for being precise. Most vendors are not.","Grazie della precisione. Molti fornitori non lo sono."),
      O("Yes, it's fully eIDAS qualified and valid in every court.","Sì, è pienamente qualificata eIDAS e vale in ogni tribunale.",
        -16,"False today. She can check it in five minutes, and then everything you said is doubted.","Falso oggi. Lo verifica in cinque minuti, e poi tutto quello che hai detto è in dubbio.",
        "Which qualified provider, please? I will check.","Quale prestatore qualificato, prego? Controllerò.", {red:true}),
      O("I think so, I'll check.","Credo di sì, verifico.",
        2,"You know the answer: today it's not qualified. \"I think so\" sounds like hiding.","La risposta la sai: oggi non è qualificata. \"Credo di sì\" sembra nascondere.",
        "You think so?","Crede?"),
      O("Courts don't really care about eIDAS.","Ai tribunali eIDAS non interessa molto.",
        -7,"Wrong. A qualified stamp gives a legal presumption: that's exactly why she asks.","Sbagliato. Una marca qualificata dà una presunzione legale: è proprio per questo che chiede.",
        "I'm afraid our lawyers disagree.","Temo che i nostri avvocati non siano d'accordo.")
    ]},
  { say:_("Our agents decide on claims. If the agent pays a claim it shouldn't, does your system block it?","I nostri agenti decidono sui sinistri. Se l'agente paga un sinistro che non dovrebbe, il vostro sistema lo blocca?"),
    tip:_("Records, doesn't control. Controls stay with the supplier. Value: proof afterwards.","Registra, non controlla. I controlli restano al fornitore. Valore: la prova dopo."),
    opts:[
      O("No. Sigillo records, it doesn't control, and it never blocks or slows the agent. Controls stay in your supplier's system. Sigillo gives you the proof afterwards: what was decided, when, and by which version of the agent.",
        "No. Sigillo registra, non controlla, e non blocca né rallenta mai l'agente. I controlli restano nel sistema del vostro fornitore. Sigillo vi dà la prova dopo: cosa è stato deciso, quando e da quale versione dell'agente.",
        12,"Clear limit and clear value. Compliance likes clear roles.","Limite chiaro e valore chiaro. La conformità ama i ruoli chiari.",
        "Clear. (She writes: \"evidence, not control\".)","Chiaro. (Scrive: \"prova, non controllo\".)"),
      O("Yes, it stops wrong payments.","Sì, ferma i pagamenti sbagliati.",
        -14,"Overpromise. Never say Sigillo controls or blocks.","Promessa eccessiva. Non dire mai che Sigillo controlla o blocca.",
        "How does it know a payment is wrong?","Come fa a sapere che un pagamento è sbagliato?", {red:true}),
      O("That depends on your supplier.","Dipende dal vostro fornitore.",
        3,"True, but add what Sigillo does: proof afterwards.","Vero, ma aggiungi cosa fa Sigillo: la prova dopo.",
        "And you do what, then?","E voi cosa fate?")
    ]},
  { say:_("We have several claims agents, very similar. If there's a problem, how does the auditor know the proof is from the right agent?","Abbiamo diversi agenti per i sinistri, molto simili. Se c'è un problema, come sa il revisore che la prova è dell'agente giusto?"),
    tip:_("Program fingerprint + reviewer link. Be honest: it stops confusion, it doesn't make cheating impossible.","Impronta del programma + link per il revisore. Onestà: elimina la confusione, non rende impossibile barare."),
    opts:[
      O("Each agent's diary records a fingerprint of its program, at every start and every code change. On the agent's computer, a short command prints that fingerprint without showing the code; the auditor compares it with the proof. And with the reviewer link, the auditor gets the proof directly from Sigillo, not from a copy someone sent.",
        "Il diario di ogni agente registra un'impronta del suo programma, a ogni avvio e a ogni cambio di codice. Sul computer dell'agente un breve comando stampa quell'impronta senza mostrare il codice; il revisore la confronta con la prova. E con il link per il revisore, la prova arriva direttamente da Sigillo, non da una copia mandata da qualcuno.",
        14,"Fingerprint + reviewer link, explained without technical words.","Impronta + link per il revisore, spiegati senza parole tecniche.",
        "That addresses my question directly.","Questo risponde direttamente alla mia domanda."),
      O("Each agent has a different name.","Ogni agente ha un nome diverso.",
        -6,"Names are chosen by the company and can be confused. That's the problem the fingerprint solves.","I nomi li sceglie l'azienda e si possono confondere. È il problema che l'impronta risolve.",
        "Names can be mixed up.","I nomi si possono confondere."),
      O("It's impossible to fake, ever.","È impossibile da falsificare, sempre.",
        -10,"Overpromise. A company that wants to cheat on its own machine could fake it; Sigillo makes confusion visible and cheating hard, not impossible.","Promessa eccessiva. Un'azienda che vuole barare sulla sua macchina potrebbe falsificarla; Sigillo rende visibile la confusione e difficile l'imbroglio, non impossibile.",
        "\"Impossible\" is a word I never accept.","\"Impossibile\" è una parola che non accetto mai.", {red:true}),
      O("The proof file has the agent's name and all its records.","Il fascicolo ha il nome dell'agente e tutte le sue ricevute.",
        5,"True, but the fingerprint is the strong answer to \"the right agent\".","Vero, ma l'impronta è la risposta forte a \"l'agente giusto\".",
        "The name again.","Di nuovo il nome.")
    ]},
  { hardOnly:true,
    say:_("Where is the data stored, and do you sign a DPA?","Dove sono conservati i dati, e firmate un DPA?"),
    tip:_("No texts, only fingerprints. Server in Italy. Signed DPA in Regulated.","Niente testi, solo impronte. Server in Italia. DPA firmato nel Regolato."),
    opts:[
      O("We never store the texts, only fingerprints. Our server is in Italy, in the EU. The Regulated plan includes a signed DPA, and a dedicated server or key. I'll have our team send you the DPA to review with your legal office.",

<script>
"use strict";
/* ================= ENGINE ================= */
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* ---------- saved progress (stays in this browser only) ---------- */
var STORE = "sigilloSalesCoach.v1";
var PROG = { learn:{}, best:{}, quizBest:null, printed:false, calls:0, lang:null };
try { var saved = JSON.parse(localStorage.getItem(STORE) || "null"); if (saved) for (var k in saved) PROG[k] = saved[k]; } catch(e){}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(PROG)); } catch(e){} }
if (PROG.lang) LANG = PROG.lang;
var RANK = {lost:0, demo:1, sale:2};
var ICON = {sale:"🏆", demo:"📅", lost:"✖️"};

/* ---------- navigation ---------- */
var VIEW = "home";
function go(v){
  VIEW = v;
  ["home","learn","practice","quiz","cheat"].forEach(function(id){ $("#"+id).classList.toggle("hidden", id !== v); });
  $$("#tabs button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-go") === v); });
  render();
  window.scrollTo(0,0);
}
function render(){
  document.documentElement.lang = LANG;
  $$("[data-i]").forEach(function(el){ el.textContent = t(UI[el.getAttribute("data-i")]); });
  $$(".lang button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-lang") === LANG); });
  if (VIEW === "home") renderHome();
  if (VIEW === "learn") renderLearn();
  if (VIEW === "practice") renderPractice();
  if (VIEW === "quiz") renderQuiz();
  if (VIEW === "cheat") renderCheat();
}
document.addEventListener("click", function(e){
  var g = e.target.closest("[data-go]"); if (g){ go(g.getAttribute("data-go")); return; }
  var l = e.target.closest("[data-lang]"); if (l){ LANG = l.getAttribute("data-lang"); PROG.lang = LANG; save(); render(); }
});

/* ---------- HOME ---------- */
function pathState(){
  var allLearn = CHAPTERS.every(function(c){ return PROG.learn[c.id]; });
  var b = PROG.best;
  function res(p,d){ return b[p] && b[p][d]; }
  var lucia = ["easy","normal","hard"].some(function(d){ return res("lucia",d); });
  var allNormal = PERSONAS.every(function(p){ var r = res(p.id,"normal") || res(p.id,"hard"); return r && r !== "lost"; });
  var boss = res("stefano","hard") && res("stefano","hard") !== "lost";
  return [allLearn, lucia, PROG.quizBest !== null && PROG.quizBest >= 8, allNormal, !!boss, PROG.printed];
}
function renderHome(){
  var st = pathState();
  var steps = [["path1","path1d","learn"],["path2","path2d","practice:lucia:easy"],["path3","path3d","quiz"],["path4","path4d","practice"],["path5","path5d","practice:stefano:hard"],["path6","path6d","cheat"]];
  var h = '<div class="hero"><div class="bigseal"></div><h1>'+t(UI.hello)+'</h1><p>'+t(UI.heroP)+'</p></div>';
  h += '<div class="card" style="margin-top:14px"><div class="oneline" style="margin:0">'+t(UI.golden)+'</div></div>';
  h += '<div class="grid g2" style="margin-top:14px"><div><h2 style="margin-top:6px">'+t(UI.pathTitle)+'</h2><div class="path">';
  steps.forEach(function(s,i){
    h += '<div class="st'+(st[i]?' done':'')+'" data-path="'+s[2]+'"><div class="num">'+(st[i]?'✓':(i+1))+'</div><div><b>'+t(UI[s[0]])+'</b><span class="small muted">'+t(UI[s[1]])+'</span></div></div>';
  });
  h += '</div></div><div><h2 style="margin-top:6px">'+t(UI.stats)+'</h2><div class="card" style="padding:12px"><table class="t"><tr><th></th><th>'+t(UI.easy)+'</th><th>'+t(UI.normal)+'</th><th>'+t(UI.hard)+'</th></tr>';
  PERSONAS.forEach(function(p){
    h += '<tr><td><b>'+esc(p.name.replace("Dott.ssa ",""))+'</b></td>';
    ["easy","normal","hard"].forEach(function(d){ var r = PROG.best[p.id] && PROG.best[p.id][d]; h += '<td title="'+(r?t(UI[r]):"")+'">'+(r?ICON[r]:'<span class="muted">·</span>')+'</td>'; });
    h += '</tr>';
  });
  h += '</table><p class="small muted" style="margin:8px 0 0">🏆 '+t(UI.sale)+' · 📅 '+t(UI.demo)+' · ✖️ '+t(UI.lost)+'</p>';
  h += '<p class="small" style="margin:8px 0 0">'+t(UI.quizTitle)+': <b>'+(PROG.quizBest===null?'–':PROG.quizBest+'/10')+'</b> · '+t(_("Calls made","Chiamate fatte"))+': <b>'+PROG.calls+'</b></p>';
  h += '<div class="btnrow"><button class="btn ghost sm" id="resetBtn">'+t(UI.reset)+'</button></div></div></div></div>';
  $("#home").innerHTML = h;
  $$("#home [data-path]").forEach(function(el){ el.onclick = function(){
    var p = el.getAttribute("data-path").split(":");
    if (p[0] === "practice" && p[1]){ SIM.diff = p[2]; go("practice"); startCall(p[1]); } else go(p[0]);
  };});
  $("#resetBtn").onclick = function(){ PROG = { learn:{}, best:{}, quizBest:null, printed:false, calls:0, lang:LANG }; save(); renderHome(); };
}

/* ---------- LEARN ---------- */
var CH = 0;
function renderLearn(){
  var c = CHAPTERS[CH]; PROG.learn[c.id] = true; save();
  var h = '<h1>'+t(UI.learnTitle)+'</h1><div class="learnnav">';
  CHAPTERS.forEach(function(x,i){ h += '<button data-ch="'+i+'" class="'+(i===CH?'on ':'')+(PROG.learn[x.id]?'seen':'')+'">'+t(x.title)+'</button>'; });
  h += '</div><div class="card"><h2>'+t(c.title)+'</h2>'+c.body()+'<div class="btnrow">';
  if (CH > 0) h += '<button class="btn ghost" id="chPrev">← '+t(UI.prev)+'</button>';
  if (CH < CHAPTERS.length-1) h += '<button class="btn" id="chNext">'+t(UI.next)+' →</button>';
  else h += '<span class="pill good" style="align-self:center">'+t(UI.learnDone)+'</span><button class="btn wax" data-go="practice">'+t(UI.goPractice)+' →</button>';
  h += '</div></div>';
  $("#learn").innerHTML = h;
  $$("#learn [data-ch]").forEach(function(b){ b.onclick = function(){ CH = +b.getAttribute("data-ch"); renderLearn(); window.scrollTo(0,0); }; });
  if ($("#chPrev")) $("#chPrev").onclick = function(){ CH--; renderLearn(); window.scrollTo(0,0); };
  if ($("#chNext")) $("#chNext").onclick = function(){ CH++; renderLearn(); window.scrollTo(0,0); };
}

/* ---------- PRACTICE ---------- */
var SIM = { diff:"normal", p:null };
var BASE = {easy:55, normal:45, hard:38};
var NEG = {easy:0.6, normal:1, hard:1.4};
function quality(d){ return d >= 8 ? "best" : d >= 1 ? "okk" : d > -9 ? "weak" : "bad"; }
function qTitle(q){ return t({best:UI.fbBest, okk:UI.fbOk, weak:UI.fbWeak, bad:UI.fbBad}[q]); }
function mood(v){ return v < 30 ? "😠" : v < 45 ? "😒" : v < 60 ? "😐" : v < 75 ? "🙂" : "😀"; }
function personaById(id){ for (var i=0;i<PERSONAS.length;i++) if (PERSONAS[i].id===id) return PERSONAS[i]; }
function nodeById(p,id){ for (var i=0;i<p.nodes.length;i++) if (p.nodes[i].id===id) return p.nodes[i]; }
function bestOpt(n){ var b = n.opts[0]; n.opts.forEach(function(o){ if (o.d > b.d) b = o; }); return b; }

function renderPractice(){
  if (SIM.p) { renderCall(); return; }
  var h = '<h1>'+t(UI.nav_practice)+'</h1><h3>'+t(UI.pickDiff)+'</h3><div class="diff">';
  ["easy","normal","hard"].forEach(function(d){ h += '<button data-diff="'+d+'" class="'+(SIM.diff===d?'on':'')+'"><b>'+t(UI[d])+'</b><span class="small muted">'+t(UI[d+"D"])+'</span></button>'; });
  h += '</div><h3>'+t(UI.pickPersona)+'</h3><div class="grid g2">';
  PERSONAS.forEach(function(p){
    var b = PROG.best[p.id] || {};
    h += '<div class="card persona" data-persona="'+p.id+'"><div class="phead"><div class="av" style="background:'+p.color+'">'+p.initials+'</div><div><b>'+esc(p.name)+' '+p.flag+'</b><span class="small muted">'+t(p.role)+'</span></div></div>'+
      '<div><span class="pill">'+t(p.icp)+'</span> <span class="stars" title="difficulty">'+"★★★★★".slice(0,p.stars)+'<span style="color:#ddd">'+"★★★★★".slice(p.stars)+'</span></span>'+(p.boss?' <span class="pill wax">BOSS</span>':'')+'</div>'+
      '<div class="small">'+t(p.personality)+'</div>'+
      '<div class="fear"><b>'+t(UI.fears)+':</b> '+t(p.fears)+'</div>'+
      '<div class="fear"><b>'+t(UI.target)+':</b> '+t(p.plan)+'</div>'+
      '<div class="res muted">'+t(UI.best)+': '+["easy","normal","hard"].map(function(d){ return t(UI[d])+' '+(b[d]?ICON[b[d]]:'·'); }).join(' &nbsp; ')+'</div>'+
      '<div><button class="btn sm">'+t(UI.start)+' →</button></div></div>';
  });
  h += '</div>';
  $("#practice").innerHTML = h;
  $$("#practice [data-diff]").forEach(function(b){ b.onclick = function(){ SIM.diff = b.getAttribute("data-diff"); renderPractice(); }; });
  $$("#practice [data-persona]").forEach(function(c){ c.onclick = function(){ startCall(c.getAttribute("data-persona")); }; });
}

function startCall(id){
  var p = personaById(id);
  SIM.p = p;
  SIM.queue = p.nodes.filter(function(n){ return !n.branch && (!n.hardOnly || SIM.diff === "hard"); });
  SIM.idx = 0;
  SIM.trust = clamp(BASE[SIM.diff] + p.adj, 10, 90);
  SIM.hist = [SIM.trust];
  SIM.log = [];
  SIM.red = 0;
  SIM.phase = "choose";
  SIM.order = shuffle(SIM.queue[0].opts.map(function(_o,i){ return i; }));
  SIM.outcome = null;
  PROG.calls++; save();
  if (VIEW !== "practice") go("practice"); else renderPractice();
}

function meterHTML(){
  var blind = SIM.diff === "hard" && !SIM.outcome;
  var v = SIM.trust;
  return '<div class="'+(blind?'blind':'')+'"><div style="display:flex;align-items:center;gap:10px"><div class="mood">'+(blind?'🤔':mood(v))+'</div><div><div class="small muted">'+t(UI.trust)+'</div><div class="trustnum">'+(blind?'?':Math.round(v))+'</div></div></div>'+
   '<div class="meter"><div class="meterbar"><div class="lines"><i style="flex:45"></i><i style="flex:30"></i><i style="flex:25"></i></div><div class="mask" style="width:'+(100-v)+'%"></div></div>'+
   '<div class="meterlbl"><span>'+t(UI.lost)+'</span><span>'+t(_("Demo","Demo"))+'</span><span>'+t(UI.sale)+'</span></div></div></div>'+
   (blind?'<p class="small muted">'+t(UI.trustHidden)+'</p>':'');
}

function sideHTML(){
  var p = SIM.p;
  var h = '<div class="card side"><div class="phead"><div class="av" style="background:'+p.color+'">'+p.initials+'</div><div><span class="small muted">'+t(UI.callWith)+'</span><b>'+esc(p.name)+' '+p.flag+'</b></div></div>'+
    '<p class="small muted" style="margin:8px 0">'+t(p.role)+'</p>'+meterHTML();
  h += '<div class="sideextra"><div class="flags">'+(SIM.diff!=="hard"||SIM.outcome ? '🚩 '+SIM.red+' / 2 · <span class="muted small">'+t(UI.redflagInfo)+'</span>' : '')+'</div>';
  h += '<p class="small" style="margin-top:10px"><b>'+t(UI.fears)+':</b> '+t(p.fears)+'</p><p class="small"><b>'+t(UI.wants)+':</b> '+t(p.wants)+'</p>';
  h += '</div><p class="small"><span class="pill">'+t(UI[SIM.diff])+'</span>'+(SIM.diff!=="hard"||SIM.outcome?' <span class="small">🚩 '+SIM.red+'/2</span>':'')+'</p>';
  h += '<button class="btn ghost sm" id="quitCall">'+t(UI.quit)+'</button></div>';
  return h;
}

function bubble(who, text){
  var p = SIM.p;
  if (who === "me") return '<div class="msg me"><div class="av">'+t(UI.you).charAt(0)+'</div><div class="bubble">'+esc(text)+'</div></div>';
  return '<div class="msg"><div class="av" style="background:'+p.color+'">'+p.initials+'</div><div class="bubble">'+esc(text)+'</div></div>';
}
function feedbackHTML(entry){
  var o = entry.opt, q = quality(o.d);
  if (SIM.diff === "hard" && !SIM.outcome) return '<div class="sys">'+t(UI.noted)+'</div>';
  var d = entry.applied;
  var h = '<div class="fb '+q+'"><h4>'+qTitle(q)+'<span class="delta '+(d>=0?'up':'down')+'">'+(d>=0?'+':'')+d+'</span>'+(o.red?'<span class="redflag">🚩 '+t(UI.redflag)+'</span>':'')+'</h4><div>'+t(o.f)+'</div>';
  if (q !== "best"){ var b = bestOpt(entry.node); h += '<div class="better"><b>'+t(UI.betterWas)+'</b> '+esc(t(b.t))+'</div>'; }
  return h + '</div>';
}

function renderCall(){
  if (SIM.outcome){ renderOutcome(); return; }
  var p = SIM.p;
  var h = '<div class="sim">'+sideHTML()+'<div class="card"><div class="chat" id="chat">';
  h += '<div class="sys">📞 '+t(p.intro)+'</div>';
  SIM.log.forEach(function(e, i){
    h += bubble("p", t(e.node.say));
    if (SIM.phase !== "choose" && i === SIM.log.length-1) h += '<div id="anchor"></div>';
    h += bubble("me", t(e.opt.t));
    if (e.opt.r) h += bubble("p", t(e.opt.r));
    if (SIM.diff !== "hard" || i === SIM.log.length-1) h += feedbackHTML(e);
  });
  if (SIM.phase === "choose"){
    var n = SIM.queue[SIM.idx];
    h += '<div id="anchor"></div>' + bubble("p", t(n.say));
    if (SIM.diff === "easy" && n.tip) h += '<div class="tip">💡 <b>'+t(UI.coach)+':</b> '+t(n.tip)+'</div>';
    h += '<div class="opts">';
    SIM.order.forEach(function(oi, k){ h += '<button class="opt" data-opt="'+oi+'"><span class="k">'+"ABCD".charAt(k)+'</span>'+esc(t(n.opts[oi].t))+'</button>'; });
    h += '</div>';
  } else {
    h += '<div class="btnrow"><button class="btn" id="contBtn">'+t(UI.cont)+' →</button></div>';
  }
  h += '</div></div></div>';
  $("#practice").innerHTML = h;
  $("#quitCall").onclick = function(){ SIM.p = null; renderPractice(); };
  $$("#practice [data-opt]").forEach(function(b){ b.onclick = function(){ choose(+b.getAttribute("data-opt")); }; });
  if ($("#contBtn")) { $("#contBtn").onclick = advance; }
  var a = $("#anchor"); if (a && SIM.log.length) a.scrollIntoView({behavior:"smooth", block:"start"});
}

function choose(oi){
  var n = SIM.queue[SIM.idx], o = n.opts[oi];
  var d = o.d > 0 ? (SIM.diff === "hard" ? Math.round(o.d * 0.85) : o.d) : Math.round(o.d * NEG[SIM.diff]);
  SIM.trust = clamp(SIM.trust + d, 0, 100);
  SIM.hist.push(SIM.trust);
  if (o.red) SIM.red++;
  SIM.log.push({node:n, opt:o, applied:d});
  if (o.next){ var b = nodeById(SIM.p, o.next); if (b) SIM.queue.splice(SIM.idx+1, 0, b); }
  SIM.phase = "feedback";
  if (SIM.diff !== "hard"){
    var f = document.createElement("div"); f.className = "float"; f.style.color = d >= 0 ? "#1d7a46" : "#b3261e";
    f.textContent = (d>=0?"+":"") + d; document.body.appendChild(f); setTimeout(function(){ f.remove(); }, 1200);
  }
  renderCall();
}

function advance(){
  var last = SIM.log[SIM.log.length-1];
  if (SIM.red >= 2 || last.node.closing || SIM.idx >= SIM.queue.length-1){ finish(); return; }
  SIM.idx++;
  SIM.order = shuffle(SIM.queue[SIM.idx].opts.map(function(_o,i){ return i; }));
  SIM.phase = "choose";
  renderCall();
}

function finish(){
  var T = SIM.trust, last = SIM.log[SIM.log.length-1], c = last.node.closing ? last.opt.c : null, out, note = null;
  if (SIM.red >= 2){ out = "lost"; note = UI.lostFlags; }
  else if (T >= 75){
    if (c === "ask") out = "sale";
    else if (c === "push"){ out = "demo"; note = UI.closeTipPush; }
    else { out = "demo"; note = UI.closeTipSoft; }
  }
  else if (T >= 45){ if (c === "push"){ out = "lost"; note = UI.closeTipPush; } else out = "demo"; }
  else out = "lost";
  SIM.outcome = out; SIM.note = note;
  var b = PROG.best[SIM.p.id] = PROG.best[SIM.p.id] || {};
  if (!b[SIM.diff] || RANK[out] > RANK[b[SIM.diff]]) b[SIM.diff] = out;
  save();
  renderOutcome();
  window.scrollTo(0,0);
}

function sparkSVG(){
  var H = SIM.hist, w = 600, h = 80, n = H.length;
  var pts = H.map(function(v,i){ return [(n===1?0:i*(w-20)/(n-1))+10, h-6-(v/100)*(h-12)]; });
  var y = function(v){ return h-6-(v/100)*(h-12); };
  var s = '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  s += '<line x1="0" x2="'+w+'" y1="'+y(75)+'" y2="'+y(75)+'" stroke="#3a9b5f" stroke-dasharray="4 4" stroke-width="1"/>';
  s += '<line x1="0" x2="'+w+'" y1="'+y(45)+'" y2="'+y(45)+'" stroke="#e3a33a" stroke-dasharray="4 4" stroke-width="1"/>';
  s += '<polyline fill="none" stroke="#2e4290" stroke-width="3" stroke-linejoin="round" points="'+pts.map(function(p){return p.join(",");}).join(" ")+'"/>';
  pts.forEach(function(p){ s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#2e4290"/>'; });
  return s + '</svg>';
}

function renderOutcome(){
  var p = SIM.p, out = SIM.outcome;
  var h = '<div class="sim">'+sideHTML()+'<div>';
  h += '<div class="outcome '+out+'"><div class="big">'+ICON[out]+'</div><h2>'+t(UI[out])+'</h2><p style="margin:0">'+t(p.outcomes[out])+'</p><p style="margin:8px 0 0;opacity:.9">'+t(UI.finalTrust)+': <b>'+Math.round(SIM.trust)+'</b>/100</p></div>';
  h += '<div class="card" style="margin-top:14px">';
  if (SIM.note) h += '<div class="note warn">'+t(SIM.note)+'</div>';
  h += '<h3>'+t(UI.lesson)+'</h3><p>'+t(p.lesson)+'</p>'+sparkSVG();
  h += '<div class="btnrow"><button class="btn" id="againBtn">↻ '+t(UI.again)+'</button>'+(SIM.diff!=="hard"?'<button class="btn wax" id="harderBtn">'+t(UI.harder)+'</button>':'')+'<button class="btn ghost" id="otherBtn">'+t(UI.other)+'</button></div></div>';
  h += '<div class="card review"><h3>'+t(UI.review)+'</h3>';
  SIM.log.forEach(function(e){
    var q = quality(e.opt.d), b = bestOpt(e.node);
    h += '<div class="ri"><div class="q">'+esc(t(e.node.say))+'</div><div style="margin:4px 0"><span class="pill '+(q==="best"?"good":q==="bad"?"wax":"gold")+'">'+qTitle(q)+' '+(e.applied>=0?'+':'')+e.applied+'</span>'+(e.opt.red?'<span class="redflag">🚩</span>':'')+'</div>'+
      '<div class="small"><b>'+t(UI.yourAns)+':</b> '+esc(t(e.opt.t))+'</div><div class="small muted" style="margin-top:3px">'+t(e.opt.f)+'</div>'+
      (q!=="best"?'<div class="small" style="margin-top:4px;color:#1d7a46"><b>'+t(UI.betterWas)+'</b> '+esc(t(b.t))+'</div>':'')+'</div>';
  });
  h += '</div></div></div>';
  $("#practice").innerHTML = h;
  $("#quitCall").onclick = function(){ SIM.p = null; renderPractice(); };
  $("#againBtn").onclick = function(){ startCall(p.id); };
  if ($("#harderBtn")) $("#harderBtn").onclick = function(){ SIM.diff = SIM.diff === "easy" ? "normal" : "hard"; startCall(p.id); };
  $("#otherBtn").onclick = function(){ SIM.p = null; renderPractice(); };
}

/* ---------- QUIZ ---------- */
var QZ = null;
function renderQuiz(){
  var h = '<h1>'+t(UI.quizTitle)+'</h1>';
  if (!QZ){
    h += '<div class="card"><p>'+t(UI.quizIntro)+'</p>'+(PROG.quizBest!==null?'<p>'+t(UI.qBest)+': <b>'+PROG.quizBest+'/10</b></p>':'')+'<button class="btn" id="qStart">'+t(UI.quizStart)+'</button></div>';
    $("#quiz").innerHTML = h; $("#qStart").onclick = function(){
      QZ = { qs: shuffle(QUIZ).slice(0,10).map(function(q){ return {q:q, order:shuffle(q.o.map(function(_x,i){return i;}))}; }), i:0, score:0, ans:null, missed:[] };
      renderQuiz(); };
    return;
  }
  if (QZ.i >= QZ.qs.length){
    var s = QZ.score, msg = s===10?UI.q10:s>=8?UI.q8:s>=5?UI.q5:UI.q0;
    if (PROG.quizBest === null || s > PROG.quizBest){ PROG.quizBest = s; save(); }
    h += '<div class="card" style="text-align:center"><div style="font-size:3rem">'+(s>=8?'🏆':s>=5?'👍':'📚')+'</div><h2>'+t(UI.score)+': '+s+'/10</h2><p>'+t(msg)+'</p></div>';
    if (QZ.missed.length){
      h += '<div class="card review" style="margin-top:14px">';
      QZ.missed.forEach(function(q){ h += '<div class="ri"><b>'+esc(t(q.q))+'</b><div class="small" style="color:#1d7a46">✓ '+esc(t(q.o[q.a]))+'</div><div class="small muted">'+t(q.e)+'</div></div>'; });
      h += '</div>';
    }
    h += '<div class="btnrow"><button class="btn" id="qAgain">↻ '+t(UI.again)+'</button><button class="btn ghost" data-go="learn">'+t(UI.nav_learn)+'</button></div>';
    $("#quiz").innerHTML = h; $("#qAgain").onclick = function(){ QZ = null; renderQuiz(); $("#qStart").click(); };
    return;
  }
  var cur = QZ.qs[QZ.i], q = cur.q;
  h += '<div class="card"><div class="small muted">'+t(UI.qOf)+' '+(QZ.i+1)+' '+t(UI.of)+' 10</div><div class="qprog"><i style="width:'+(QZ.i*10)+'%"></i></div><h2>'+esc(t(q.q))+'</h2>';
  cur.order.forEach(function(oi){
    var cls = "";
    if (QZ.ans !== null){ if (oi === q.a) cls = "right"; else if (oi === QZ.ans) cls = "wrong"; }
    h += '<button class="qopt '+cls+'" data-q="'+oi+'"'+(QZ.ans!==null?' disabled':'')+'>'+esc(t(q.o[oi]))+'</button>';
  });
  if (QZ.ans !== null){
    var ok = QZ.ans === q.a;
    h += '<div class="fb '+(ok?'best':'bad')+'" style="margin-top:10px"><h4>'+t(ok?UI.correct:UI.wrong)+'</h4>'+t(q.e)+'</div><div class="btnrow"><button class="btn" id="qNext">'+t(QZ.i===9?UI.qEnd:UI.qNext)+' →</button></div>';
  }
  h += '</div>';
  $("#quiz").innerHTML = h;
  $$("#quiz [data-q]").forEach(function(b){ b.onclick = function(){ if (QZ.ans!==null) return; QZ.ans = +b.getAttribute("data-q"); if (QZ.ans === q.a) QZ.score++; else QZ.missed.push(q); renderQuiz(); }; });
  if ($("#qNext")) $("#qNext").onclick = function(){ QZ.i++; QZ.ans = null; renderQuiz(); window.scrollTo(0,0); };
}

/* ---------- CHEAT SHEET ---------- */
var FLASH = null;
function renderCheat(){
  var h = '<div class="noprint" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px"><h1 style="margin:0;flex:1">'+t(UI.cheatTitle)+'</h1>'+
    '<button class="btn wax" id="printBtn">🖨 '+t(UI.print)+'</button><button class="btn ghost" id="flashBtn">'+t(FLASH?UI.tableBtn:UI.flashBtn)+'</button></div>';
  if (FLASH){
    var o = OBJ[FLASH.order[FLASH.i]];
    h += '<p class="muted noprint">'+t(UI.flashTap)+' ('+(FLASH.i+1)+'/'+OBJ.length+')</p><div class="card flash" id="flashCard"><div class="fq">'+esc(t(o.q))+'</div>';
    if (FLASH.show) h += '<div class="fa"><div class="say"><b>'+t(UI.colAns)+'</b>'+esc(t(o.a))+'</div><div class="never"><b>'+t(UI.colNever)+'</b>'+esc(t(o.n))+'</div></div>';
    h += '</div><div class="btnrow"><button class="btn" id="flashNext">'+t(UI.flashNext)+' →</button></div>';
    $("#cheat").innerHTML = h;
    $("#flashCard").onclick = function(){ FLASH.show = !FLASH.show; renderCheat(); };
    $("#flashNext").onclick = function(){ FLASH.i = (FLASH.i+1) % OBJ.length; FLASH.show = false; renderCheat(); };
  } else {
    h += '<div class="card cheat"><div class="printonly"><h1>Sigillo · '+t(UI.cheatTitle)+'</h1></div>';
    h += '<h2>'+t(UI.pitchTitle)+'</h2><div class="oneline">'+t(PITCH)+'</div>';
    h += '<table class="t"><tr><th>'+t(UI.colObj)+'</th><th>'+t(UI.colAns)+'</th><th>'+t(UI.colNever)+'</th></tr>';
    OBJ.forEach(function(o){ h += '<tr><td>'+esc(t(o.q))+'</td><td>'+esc(t(o.a))+'</td><td>'+esc(t(o.n))+'</td></tr>'; });
    h += '</table><h2 style="margin-top:18px">'+t(UI.pricesTitle)+'</h2>'+plansHTML();
    PLAN_NOTES.forEach(function(n){ h += '<div class="note small">'+t(n)+'</div>'; });
    h += '<h2 style="margin-top:18px">'+t(UI.wordsTitle)+'</h2>'+wordsHTML();
    h += '<div class="note" style="margin-top:12px">'+t(_("<b>Don't know?</b> \"Good question. I'll check with our technical lead and get back to you by tomorrow.\" Then ask Giovanni.","<b>Non sai?</b> \"Bella domanda. Verifico con il nostro responsabile tecnico e vi rispondo entro domani.\" Poi chiedi a Giovanni."))+'</div></div>';
    $("#cheat").innerHTML = h;
  }
  $("#printBtn").onclick = function(){ if (FLASH){ FLASH = null; renderCheat(); } PROG.printed = true; save(); setTimeout(function(){ window.print(); }, 50); };
  $("#flashBtn").onclick = function(){ FLASH = FLASH ? null : { order: shuffle(OBJ.map(function(_x,i){return i;})), i:0, show:false }; renderCheat(); };
}

/* ---------- start ---------- */
go("home");
