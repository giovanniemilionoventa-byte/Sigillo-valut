<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigillo Sales Coach</title>
<style>
:root{
  --paper:#f7f5f0; --card:#ffffff; --ink:#1c2233; --muted:#5d6475; --line:#e3dfd6;
  --navy:#1f2d5c; --navy2:#2e4290; --wax:#a8231d; --wax2:#c8372f; --gold:#b8902b;
  --good:#1d7a46; --goodbg:#e7f5ec; --ok:#9a6a00; --okbg:#fdf3dc; --bad:#b3261e; --badbg:#fbe9e7;
  --radius:14px; --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 16px rgba(20,25,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--navy2)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0 0 .8em}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* top bar */
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topin{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:980px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;cursor:pointer}
.seal{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9534b,#9c1f19 70%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}
.brand small{display:block;font-weight:400;opacity:.75;font-size:.75rem}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{background:transparent;border:0;color:#dfe4f5;padding:7px 11px;border-radius:9px;font-size:.92rem}
nav.tabs button:hover{background:rgba(255,255,255,.08)}
nav.tabs button.on{background:#fff;color:var(--navy);font-weight:600}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:9px;overflow:hidden}
.lang button{background:transparent;border:0;color:#fff;padding:6px 10px;font-size:.85rem;font-weight:600}
.lang button.on{background:var(--gold);color:#1c1606}

main{padding:22px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:#eef1fa;color:var(--navy)}
.pill.wax{background:#f8e5e3;color:var(--wax)}
.pill.gold{background:#f6eed7;color:#6f5512}
.pill.good{background:var(--goodbg);color:var(--good)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:600;background:var(--navy2);color:#fff;transition:transform .05s,background .15s}
.btn:hover{background:var(--navy)}
.btn:active{transform:translateY(1px)}
.btn.wax{background:var(--wax)} .btn.wax:hover{background:#8c1c17}
.btn.ghost{background:#fff;color:var(--navy2);border:1.5px solid var(--navy2)}
.btn.ghost:hover{background:#f1f3fb}
.btn.sm{padding:7px 12px;font-size:.9rem}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hidden{display:none!important}

/* home */
.hero{background:linear-gradient(135deg,var(--navy) 0%,#33479a 100%);color:#fff;border-radius:18px;padding:26px 24px;position:relative;overflow:hidden}
.hero h1{font-size:1.9rem}
.hero p{opacity:.92;max-width:640px}
.hero .bigseal{position:absolute;right:-30px;top:-30px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9534b,#8f1b16 70%);opacity:.25}
.path{counter-reset:step;display:grid;gap:10px;margin-top:6px}
.path .st{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.path .st:hover{border-color:var(--navy2)}
.path .num{flex:0 0 30px;height:30px;border-radius:50%;background:#eef1fa;color:var(--navy);display:grid;place-items:center;font-weight:700}
.path .st.done .num{background:var(--good);color:#fff}
.path .st b{display:block}

/* learn */
.learnnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.learnnav button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:.88rem;color:var(--ink)}
.learnnav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.learnnav button.seen::after{content:" ✓";color:var(--good);font-weight:700}
.learnnav button.on.seen::after{color:#9fe0b8}
.oneline{background:#f6eed7;border-left:4px solid var(--gold);padding:10px 14px;border-radius:8px;margin:0 0 14px;font-weight:600}
.say{background:var(--goodbg);border-left:4px solid var(--good);padding:10px 14px;border-radius:8px;margin:10px 0}
.never{background:var(--badbg);border-left:4px solid var(--bad);padding:10px 14px;border-radius:8px;margin:10px 0}
.say b,.never b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.say b{color:var(--good)} .never b{color:var(--bad)}
.steps4{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:12px 0}
.steps4 .s{background:#f8f9fd;border:1px solid var(--line);border-radius:12px;padding:12px}
.steps4 .s .ic{font-size:1.6rem}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.cols2{grid-template-columns:1fr}}
.yes,.no{border-radius:12px;padding:12px 14px}
.yes{background:var(--goodbg)} .no{background:var(--badbg)}
.yes h4{color:var(--good)} .no h4{color:var(--bad)}
ul.clean{padding-left:18px;margin:6px 0}
ul.clean li{margin:4px 0}
table.t{width:100%;border-collapse:collapse;font-size:.93rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
table.t th{background:#f3f4f8;font-size:.82rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.plans{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:10px 0}
.plan{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:#fff;position:relative}
.plan.star{border-color:var(--gold);box-shadow:0 0 0 3px #f6eed7}
.plan .price{font-size:1.5rem;font-weight:800;color:var(--navy)}
.plan .price small{font-size:.85rem;font-weight:500;color:var(--muted)}
.plan .tag{position:absolute;top:-10px;right:12px}
.note{background:#eef1fa;border-radius:10px;padding:10px 14px;font-size:.92rem;margin:10px 0}
.note.warn{background:#fff4e0;border:1px solid #f0d9a8}
.mock{border:1px solid #cfd5e6;border-radius:12px;background:#f5f6f9;padding:14px;margin:12px 0;font-size:.92rem}
.mock .mcard{background:#fff;border:1px solid #e4e7ef;border-radius:10px;padding:14px;margin-bottom:10px}
.mock .row{display:flex;gap:10px;margin:3px 0}
.mock .row span:first-child{color:var(--muted);min-width:140px}
.mock .mb{display:inline-block;padding:7px 14px;border-radius:8px;font-weight:600;margin-right:8px}
.mock .mb.p{background:#1d4ed8;color:#fff} .mock .mb.s{border:1.5px solid #1d4ed8;color:#1d4ed8;background:#fff}
.mock code{font-size:.78rem;word-break:break-all}
.gloss dt{font-weight:700;margin-top:8px} .gloss dd{margin:2px 0 0 0;color:var(--muted)}

/* practice: persona picker */
.diff{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.diff button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;text-align:left;min-width:170px}
.diff button b{display:block}
.diff button.on{border-color:var(--navy2);background:#f1f3fb;box-shadow:0 0 0 3px #e2e7f8}
.persona{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,transform .1s}
.persona:hover{border-color:var(--navy2);transform:translateY(-1px)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.15rem;flex:0 0 52px}
.phead{display:flex;gap:12px;align-items:center}
.phead b{display:block;font-size:1.05rem}
.stars{color:var(--gold);letter-spacing:1px}
.res{font-size:.8rem}
.fear{font-size:.88rem;color:var(--muted)}

/* chat */
.sim{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media(max-width:780px){.sim{grid-template-columns:1fr}}
.side{position:sticky;top:76px}
@media(max-width:780px){.side{position:static}}
.meter{margin:10px 0 4px}
.meterbar{height:14px;border-radius:99px;background:linear-gradient(90deg,#d0453c 0%,#e3a33a 45%,#3a9b5f 75%,#1d7a46 100%);position:relative}
.meterbar .mask{position:absolute;right:0;top:0;bottom:0;background:#e9e6df;border-radius:0 99px 99px 0;transition:width .6s ease}
.meterbar .lines{position:absolute;inset:0;display:flex}
.meterbar .lines i{flex:1;border-right:2px solid rgba(255,255,255,.6)}
.meterbar .lines i:last-child{border:0}
.meterlbl{display:grid;grid-template-columns:45fr 30fr 25fr;font-size:.78rem;color:var(--muted);margin-top:4px;text-align:center}
#anchor{scroll-margin-top:84px}
@media(max-width:700px){header.top{position:static}.topin{gap:6px;padding:8px 12px}nav.tabs{margin-left:0;order:3;width:100%}nav.tabs button{padding:6px 8px;font-size:.85rem}.lang{margin-left:auto}.sideextra{display:none}.side{padding:14px}#anchor{scroll-margin-top:10px}h1{font-size:1.45rem}.hero h1{font-size:1.5rem}}
.trustnum{font-size:1.6rem;font-weight:800}
.mood{font-size:2rem;line-height:1}
.blind .meterbar{filter:blur(5px) grayscale(1);opacity:.5}
.chat{display:flex;flex-direction:column;gap:12px;min-height:300px}
.msg{display:flex;gap:10px;align-items:flex-end;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .av{width:36px;height:36px;flex:0 0 36px;font-size:.85rem}
.bubble{background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:620px;box-shadow:var(--shadow)}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:var(--navy2);color:#fff;border-color:var(--navy2);border-radius:16px 16px 4px 16px}
.msg.me .av{background:var(--gold)}
.sys{font-size:.9rem;color:var(--muted);background:#efede7;border-radius:10px;padding:10px 14px}
.tip{background:#f6eed7;border-radius:10px;padding:10px 14px;font-size:.92rem}
.tip b{color:#6f5512}
.opts{display:grid;gap:9px}
.opt{text-align:left;background:#fff;border:1.5px solid #cfd5e6;border-radius:12px;padding:11px 14px;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--navy2);background:#f5f7fd}
.opt .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#eef1fa;color:var(--navy);font-weight:700;font-size:.8rem;margin-right:8px}
.fb{border-radius:12px;padding:12px 14px;animation:pop .25s ease}
.fb.best{background:var(--goodbg);border:1px solid #bfe3cc}
.fb.okk{background:var(--okbg);border:1px solid #f0dca8}
.fb.weak{background:#fdf0e4;border:1px solid #f2d0ae}
.fb.bad{background:var(--badbg);border:1px solid #f1c3be}
.fb h4{margin:0 0 4px;font-size:1rem}
.fb.best h4{color:var(--good)} .fb.okk h4{color:var(--ok)} .fb.weak h4{color:#a4561a} .fb.bad h4{color:var(--bad)}
.fb .better{margin-top:8px;font-size:.92rem;background:rgba(255,255,255,.7);border-radius:8px;padding:8px 10px}
.delta{font-weight:800;margin-left:6px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.float{position:fixed;right:24px;top:90px;font-size:1.6rem;font-weight:900;pointer-events:none;animation:flt 1.1s ease forwards;z-index:50}
@keyframes flt{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.redflag{display:inline-block;background:var(--bad);color:#fff;border-radius:6px;padding:1px 7px;font-size:.75rem;font-weight:700;margin-left:6px}
.flags{font-size:.88rem;margin-top:8px}

/* outcome */
.outcome{text-align:center;padding:26px 20px;border-radius:18px;color:#fff}
.outcome.sale{background:linear-gradient(135deg,#1d7a46,#2fa565)}
.outcome.demo{background:linear-gradient(135deg,#9a6a00,#d39a1c)}
.outcome.lost{background:linear-gradient(135deg,#7d1a15,#b3261e)}
.outcome .big{font-size:2.6rem}
.outcome h2{font-size:1.6rem;margin:.2em 0}
.review{margin-top:16px}
.review .ri{border-bottom:1px solid var(--line);padding:10px 0}
.review .ri:last-child{border:0}
.review .q{font-size:.88rem;color:var(--muted)}
.spark{width:100%;height:80px;margin:8px 0}

/* quiz */
.qprog{height:8px;background:#e9e6df;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.qprog i{display:block;height:100%;background:var(--navy2);transition:width .3s}
.qopt{display:block;width:100%;text-align:left;margin:8px 0;background:#fff;border:1.5px solid #cfd5e6;border-radius:12px;padding:11px 14px;color:var(--ink)}
.qopt:hover{border-color:var(--navy2)}
.qopt.right{border-color:var(--good);background:var(--goodbg)}
.qopt.wrong{border-color:var(--bad);background:var(--badbg)}
.qopt:disabled{cursor:default}

/* cheat sheet */
.cheat table.t td:first-child{font-weight:600;width:24%}
.cheat table.t td:nth-child(3){color:var(--bad);width:20%}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .fq{font-size:1.3rem;font-weight:700}
.flash .fa{margin-top:14px;text-align:left}
.printonly{display:none}

footer{color:var(--muted);font-size:.8rem;text-align:center;padding:20px}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:10.5pt}
  header.top,footer,.noprint,nav{display:none!important}
  main{padding:0}
  section{display:none!important}
  section#cheat{display:block!important}
  .card{box-shadow:none;border:0;padding:0}
  .printonly{display:block}
  table.t{font-size:9pt}
  table.t th,table.t td{padding:4px 6px}
  tr{page-break-inside:avoid}
  .plans{grid-template-columns:repeat(4,1fr);gap:6px}
  .plan{padding:8px}
  .plan .price{font-size:1.1rem}
  h2{font-size:13pt;margin-top:10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand" data-go="home"><div class="seal">S</div><div><span data-i="appname"></span><small data-i="appsub"></small></div></div>
    <nav class="tabs" id="tabs">
      <button data-go="home" data-i="nav_home"></button>
      <button data-go="learn" data-i="nav_learn"></button>
      <button data-go="practice" data-i="nav_practice"></button>
      <button data-go="quiz" data-i="nav_quiz"></button>
      <button data-go="cheat" data-i="nav_cheat"></button>
    </nav>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="it">IT</button></div>
  </div>
</header>
<main class="wrap">
  <section id="home"></section>
  <section id="learn" class="hidden"></section>
  <section id="practice" class="hidden"></section>
  <section id="quiz" class="hidden"></section>
  <section id="cheat" class="hidden"></section>
</main>
<footer><span data-i="footer"></span></footer>
<script>
"use strict";
/* ---------- language helpers ---------- */
function _(en, it){ return {en:en, it:it}; }
var LANG = "en";
function t(x){ if (x && typeof x === "object" && "en" in x) return x[LANG] || x.en; return x; }

/* ---------- interface words ---------- */
var UI = {
  appname:_("Sigillo Sales Coach","Sigillo Sales Coach"),
  appsub:_("Practice selling Sigillo","Allenati a vendere Sigillo"),
  nav_home:_("Home","Inizio"), nav_learn:_("Learn","Impara"), nav_practice:_("Practice calls","Simula chiamate"),
  nav_quiz:_("Quiz","Quiz"), nav_cheat:_("Cheat sheet","Scheda obiezioni"),
  footer:_("Sigillo Sales Coach · works offline · prices = proposal of 15 November 2026, to be agreed with Giovanni · all clients in the calls are invented",
           "Sigillo Sales Coach · funziona senza internet · prezzi = proposta del 15 novembre 2026, da decidere con Giovanni · tutti i clienti delle chiamate sono inventati"),
  hello:_("Hi Polina! Ready to practise?","Ciao Polina! Pronta ad allenarti?"),
  heroP:_("This is your training room for selling Sigillo. You will learn what Sigillo does in simple words, talk to five invented clients based on our real target customers, and learn to answer the hard questions honestly. No real client sees anything here.",
          "Questa è la tua palestra per vendere Sigillo. Impari cosa fa Sigillo con parole semplici, parli con cinque clienti inventati, costruiti sui nostri clienti tipo reali, e impari a rispondere onestamente alle domande difficili. Nessun cliente vero vede niente di tutto questo."),
  golden:_("The golden rule: never promise more than Sigillo does. An honest \"no\" builds more trust than a big \"yes\".",
           "La regola d'oro: mai promettere più di quello che Sigillo fa. Un \"no\" onesto crea più fiducia di un grande \"sì\"."),
  pathTitle:_("Your training path","Il tuo percorso"),
  path1:_("Learn Sigillo in 10 minutes","Impara Sigillo in 10 minuti"), path1d:_("9 short chapters, no technical words.","9 capitoli brevi, senza parole tecniche."),
  path2:_("First call on Easy: Lucía (HR start-up)","Prima chiamata in Facile: Lucía (start-up HR)"), path2d:_("With coach tips before every answer.","Con i consigli del coach prima di ogni risposta."),
  path3:_("Take the quiz","Fai il quiz"), path3d:_("Aim for 8 out of 10 or more.","Punta ad almeno 8 su 10."),
  path4:_("All five clients on Normal","Tutti e cinque i clienti in Normale"), path4d:_("Get a sale or a demo with each one.","Ottieni una vendita o una demo con ognuno."),
  path5:_("Hard mode, and the boss: Stefano (bank)","Modalità Difficile e il capo: Stefano (banca)"), path5d:_("No trust meter, no feedback until the end. Like a real call.","Niente misuratore di fiducia, niente commenti fino alla fine. Come una chiamata vera."),
  path6:_("Print the cheat sheet","Stampa la scheda obiezioni"), path6d:_("One page to keep next to you during real calls.","Un foglio da tenere accanto durante le chiamate vere."),
  stats:_("Your results","I tuoi risultati"), reset:_("Reset my progress","Azzera i miei progressi"),
  resetQ:_("Progress reset.","Progressi azzerati."),
  start:_("Start","Inizia"),
  // learn
  learnTitle:_("Learn Sigillo","Impara Sigillo"), next:_("Next chapter","Capitolo successivo"), prev:_("Previous","Precedente"),
  learnDone:_("You finished all chapters. Now try a practice call!","Hai finito tutti i capitoli. Ora prova una chiamata!"),
  goPractice:_("Go to practice calls","Vai alle chiamate"),
  // practice
  pickDiff:_("1. Choose the difficulty","1. Scegli la difficoltà"),
  pickPersona:_("2. Choose who you call","2. Scegli chi chiamare"),
  easy:_("Easy","Facile"), normal:_("Normal","Normale"), hard:_("Hard","Difficile"),
  easyD:_("Coach tip before each answer. Mistakes cost less.","Consiglio del coach prima di ogni risposta. Gli errori costano meno."),
  normalD:_("Trust meter and feedback after each answer.","Misuratore di fiducia e commento dopo ogni risposta."),
  hardD:_("Harder client, extra questions, no meter, feedback only at the end.","Cliente più duro, domande in più, niente misuratore, commenti solo alla fine."),
  fears:_("Fears","Paure"), wants:_("Wants","Vuole"), best:_("Best result","Miglior risultato"),
  target:_("Plan to aim for","Piano a cui puntare"),
  callWith:_("Call with","Chiamata con"), trust:_("Trust","Fiducia"),
  trustHidden:_("Hard mode: you can't see their mind. Read their words.","Modalità difficile: non leggi nella loro mente. Ascolta le loro parole."),
  coach:_("Coach tip","Consiglio del coach"), cont:_("Continue","Continua"), quit:_("Leave the call","Esci dalla chiamata"),
  you:_("You","Tu"),
  fbBest:_("Great answer","Ottima risposta"), fbOk:_("OK, but could be better","Va bene, ma si può fare meglio"),
  fbWeak:_("Weak answer","Risposta debole"), fbBad:_("Dangerous answer","Risposta pericolosa"),
  betterWas:_("Better answer:","Risposta migliore:"),
  redflag:_("RED FLAG","CAMPANELLO D'ALLARME"),
  redflagInfo:_("Red flags: overpromises or false facts. Two red flags and the client is lost.","Campanelli d'allarme: promesse eccessive o fatti falsi. Con due campanelli il cliente è perso."),
  noted:_("Noted. (Hard mode: feedback at the end.)","Annotato. (Modalità difficile: commenti alla fine.)"),
  sale:_("Sale!","Vendita!"), demo:_("Demo booked","Demo fissata"), lost:_("Lost","Perso"),
  finalTrust:_("Final trust","Fiducia finale"),
  review:_("Review of your answers","Riepilogo delle tue risposte"),
  yourAns:_("Your answer","La tua risposta"),
  again:_("Try again","Riprova"), other:_("Choose another client","Scegli un altro cliente"),

{ id:"what", title:_("1. What Sigillo is","1. Cos'è Sigillo"), body:function(){ return t(_(
'<div class="oneline">Sigillo is a sealed diary for AI agents.</div>'+
'<p>An <b>AI agent</b> is a program that uses AI to do jobs by itself: read a CV, answer a customer, prepare a payment, decide on an insurance claim.</p>'+
'<p>When something goes wrong, people ask: <i>"What exactly did the AI do? When? Can you prove it?"</i> Normally the only answer is the company\'s own records, and an outsider has to trust them.</p>'+
'<p><b>Sigillo writes down every action of the agent in a diary, and seals every line.</b> If anyone changes or deletes a line later, even us, it shows. An auditor can check the diary alone, with a free program, without trusting the company or us.</p>'+
'<div class="note"><b>Picture it like this:</b> a notary who stamps every page of a diary as it is written. You can still tear out a page, but everybody will see the missing stamp.</div>'+
'<div class="say"><b>Say it like this</b>'+PITCH.en+'</div>'+
'<p class="small muted">Our website: get-sigillo.eu · slogan: "Prove what your AI did. When it matters most."</p>',
'<div class="oneline">Sigillo è un diario sigillato per gli agenti AI.</div>'+
'<p>Un <b>agente AI</b> è un programma che usa l\'intelligenza artificiale per fare lavori da solo: leggere un CV, rispondere a un cliente, preparare un pagamento, decidere su un sinistro.</p>'+
'<p>Quando qualcosa va storto, la gente chiede: <i>"Cosa ha fatto esattamente l\'AI? Quando? Puoi dimostrarlo?"</i> Di solito l\'unica risposta sono i registri dell\'azienda stessa, e chi sta fuori deve fidarsi.</p>'+
'<p><b>Sigillo scrive in un diario ogni azione dell\'agente e sigilla ogni riga.</b> Se qualcuno dopo cambia o cancella una riga, anche noi, si vede. Un revisore può controllare il diario da solo, con un programma gratuito, senza fidarsi né dell\'azienda né di noi.</p>'+
'<div class="note"><b>Immaginalo così:</b> un notaio che timbra ogni pagina di un diario mentre viene scritta. Puoi ancora strappare una pagina, ma tutti vedranno il timbro mancante.</div>'+
'<div class="say"><b>Dillo così</b>'+PITCH.it+'</div>'+
'<p class="small muted">Il nostro sito: get-sigillo.eu · slogan: "Prove what your AI did. When it matters most."</p>'));}},

{ id:"how", title:_("2. How it works, in 4 steps","2. Come funziona, in 4 passi"), body:function(){ return t(_(
'<div class="oneline">Connect once, then everything is recorded, sealed and stamped by itself.</div>'+
'<div class="steps4">'+
'<div class="s"><div class="ic">🔌</div><b>1. Connect</b><br>The developer adds <b>3 lines</b> to the agent\'s Python program. We do the first connection together in a <b>20-minute call</b>.</div>'+
'<div class="s"><div class="ic">📝</div><b>2. Record</b><br>Every action becomes a sealed line in the diary. Only a <b>fingerprint</b> of each text leaves the client\'s computer, never the text.</div>'+
'<div class="s"><div class="ic">⏱️</div><b>3. Stamp</b><br>Every hour an <b>outside company</b> puts a time stamp on the diary. It proves the diary existed like that, at that hour.</div>'+
'<div class="s"><div class="ic">🔍</div><b>4. Check</b><br>The client shares a <b>reviewer link</b> or downloads a <b>proof file</b>. The auditor checks it with a free program.</div>'+
'</div>'+
'<p><b>A fingerprint?</b> It is a short code (64 characters) made from a text. The same text always gives the same code, but you cannot turn the code back into the text. So we can prove a text was used without ever seeing it.</p>'+
'<p><b>Good things to know:</b></p><ul class="clean">'+
'<li>If the internet or our server goes down, <b>nothing is lost</b>: the agent keeps working and the diary catches up by itself later.</li>'+
'<li>Sigillo <b>never stops or slows</b> the agent.</li>'+
'<li>The AI model (ChatGPT, Claude, Mistral…) <b>does not know Sigillo exists</b>. Sigillo is code inside the program, not a sentence in the prompt. So the AI cannot switch it off.</li>'+
'<li>Today Sigillo works with agents written in <b>Python</b> (the most common language for AI agents). Not other languages yet.</li>'+
'<li>Our server is in <b>Italy</b> (EU).</li></ul>',
'<div class="oneline">Si collega una volta, poi tutto viene registrato, sigillato e timbrato da solo.</div>'+
'<div class="steps4">'+
'<div class="s"><div class="ic">🔌</div><b>1. Collegare</b><br>Lo sviluppatore aggiunge <b>3 righe</b> al programma Python dell\'agente. Il primo collegamento lo facciamo insieme in una <b>chiamata di 20 minuti</b>.</div>'+
'<div class="s"><div class="ic">📝</div><b>2. Registrare</b><br>Ogni azione diventa una riga sigillata del diario. Dal computer del cliente esce solo l\'<b>impronta</b> di ogni testo, mai il testo.</div>'+
'<div class="s"><div class="ic">⏱️</div><b>3. Timbrare</b><br>Ogni ora un\'<b>azienda esterna</b> mette una marca temporale sul diario. Prova che il diario era così, a quell\'ora.</div>'+
'<div class="s"><div class="ic">🔍</div><b>4. Controllare</b><br>Il cliente condivide un <b>link per il revisore</b> o scarica un <b>fascicolo delle prove</b>. Il revisore lo controlla con un programma gratuito.</div>'+
'</div>'+
'<p><b>Un\'impronta?</b> È un codice corto (64 caratteri) ricavato da un testo. Lo stesso testo dà sempre lo stesso codice, ma dal codice non si torna al testo. Così possiamo dimostrare che un testo è stato usato senza mai vederlo.</p>'+
'<p><b>Cose utili da sapere:</b></p><ul class="clean">'+
'<li>Se cade internet o il nostro server, <b>non si perde niente</b>: l\'agente continua a lavorare e il diario si rimette in pari da solo dopo.</li>'+
'<li>Sigillo <b>non ferma e non rallenta mai</b> l\'agente.</li>'+
'<li>Il modello AI (ChatGPT, Claude, Mistral…) <b>non sa che Sigillo esiste</b>. Sigillo è codice dentro il programma, non una frase nel prompt. Quindi l\'AI non può spegnerlo.</li>'+
'<li>Oggi Sigillo funziona con agenti scritti in <b>Python</b> (il linguaggio più usato per gli agenti AI). Non ancora con altri linguaggi.</li>'+
'<li>Il nostro server è in <b>Italia</b> (UE).</li></ul>'));}},

{ id:"limits", title:_("3. What it proves, and what it doesn't","3. Cosa prova e cosa no"), body:function(){ return t(_(
'<div class="oneline">Knowing the limits is your superpower: clients trust the seller who says them first.</div>'+
'<div class="cols2"><div class="yes"><h4>✅ Sigillo proves</h4><ul class="clean">'+
'<li><b>What</b> the agent did: each question to the AI, each tool it used, each decision recorded.</li>'+
'<li><b>When</b> it existed: hourly time stamp from an outside company.</li>'+
'<li>That <b>nobody changed it afterwards</b>, not the client, not us.</li>'+
'<li><b>Which version of the agent program</b> wrote the diary (program fingerprint).</li>'+
'<li>That a given text (an email, a letter) is <b>exactly</b> the one the agent produced, if the client uses its key.</li>'+
'<li>When the agent <b>went silent</b>, and when its <b>code changed</b>.</li></ul></div>'+
'<div class="no"><h4>❌ Sigillo does NOT</h4><ul class="clean">'+
'<li><b>Stop or block</b> the agent. It records; it does not control.</li>'+
'<li>Check if the AI\'s answer was <b>true or fair</b>.</li>'+
'<li>Prove the agent recorded <b>everything</b> if a programmer removes Sigillo on purpose (but the silence shows).</li>'+
'<li>Make anyone <b>"compliant"</b> with the AI Act or GDPR. It gives <b>evidence</b> that helps.</li>'+
'<li>Give a <b>qualified eIDAS</b> time stamp <b>today</b> (planned for paid plans).</li>'+
'<li>Work with agents in languages other than <b>Python</b>, today.</li></ul></div></div>'+
'<div class="note warn"><b>Why this matters:</b> clients in finance, insurance and HR are careful. If you promise something and they find out it is not true, you lose them and they tell others. If you say a limit first, they believe everything else you say.</div>',
'<div class="oneline">Conoscere i limiti è il tuo superpotere: i clienti si fidano di chi li dice per primo.</div>'+
'<div class="cols2"><div class="yes"><h4>✅ Sigillo prova</h4><ul class="clean">'+
'<li><b>Cosa</b> ha fatto l\'agente: ogni domanda all\'AI, ogni strumento usato, ogni decisione registrata.</li>'+
'<li><b>Quando</b> esisteva: marca temporale oraria di un\'azienda esterna.</li>'+
'<li>Che <b>nessuno l\'ha cambiato dopo</b>, né il cliente né noi.</li>'+
'<li><b>Quale versione del programma</b> dell\'agente ha scritto il diario (impronta del programma).</li>'+
'<li>Che un certo testo (un\'email, una lettera) è <b>esattamente</b> quello prodotto dall\'agente, se il cliente usa la sua chiave.</li>'+

'<li>Controlla se la risposta dell\'AI era <b>vera o giusta</b>.</li>'+
'<li>Prova che l\'agente ha registrato <b>tutto</b> se un programmatore toglie Sigillo apposta (ma il silenzio si vede).</li>'+
'<li>Rende nessuno <b>"conforme"</b> all\'AI Act o al GDPR. Dà <b>prove</b> che aiutano.</li>'+
'<li>Dà <b>oggi</b> una marca temporale <b>qualificata eIDAS</b> (prevista nei piani a pagamento).</li>'+

'<div class="note warn"><b>Perché conta:</b> i clienti di finanza, assicurazioni e risorse umane sono prudenti. Se prometti qualcosa e scoprono che non è vero, li perdi e lo raccontano ad altri. Se dici tu per primo un limite, credono a tutto il resto.</div>'));}},

{ id:"reviewer", title:_("4. New: reviewer link and program fingerprint","4. Novità: link per il revisore e impronta del programma"), body:function(){ return t(_(
'<div class="oneline">The auditor gets the proof straight from Sigillo, and can check it is from the right agent.</div>'+
'<h3>The problem</h3><p>A company has 5 similar agents. One makes a mistake. The auditor receives a proof file. How do they know it comes from Sigillo, and from <i>that</i> agent, not another one?</p>'+

'<li>Sigillo makes a link: <b>read-only</b>, only that agent and those dates, <b>expires after 30 days</b>, can be cancelled at any time.</li>'+

'<div class="mock"><div class="mcard"><b style="font-size:1.1rem">Evidence of an AI agent</b><div class="row"><span>Company</span><b>Example Insurance S.p.A.</b></div><div class="row"><span>Agent</span><b>claims-north</b></div><div class="row"><span>Link expires on</span><b>15 Dec</b></div><div style="margin-top:10px"><span class="mb p">Verify here</span><span class="mb s">Download</span></div></div>'+

'<h3>2. The program fingerprint</h3><p>Every time the agent starts, and every time its code changes, the <b>fingerprint of its program</b> goes into the diary. On the agent\'s computer, one short command prints that fingerprint (64 characters) and <b>nothing of the code</b>. The auditor compares it with the one in the proof: if they match, this is the program that wrote the diary, from that date.</p>'+

'<li>Il revisore apre una pagina di Sigillo con due pulsanti: <b>"Verifica qui"</b> (controlla la prova direttamente nel browser) e <b>"Scarica"</b> (il fascicolo, da controllare sul suo computer con il verificatore gratuito).</li>'+
'<li>La condivisione stessa viene scritta nel diario: resta traccia di chi ha condiviso cosa e quando.</li></ol>'+
'<div class="mock"><div class="mcard"><b style="font-size:1.1rem">Prove di un agente AI</b><div class="row"><span>Azienda</span><b>Esempio Assicurazioni S.p.A.</b></div><div class="row"><span>Agente</span><b>sinistri-nord</b></div><div class="row"><span>Il link scade il</span><b>15 dic</b></div><div style="margin-top:10px"><span class="mb p">Verifica qui</span><span class="mb s">Scarica</span></div></div>'+

'<div class="note warn"><b>Stato:</b> tutti e due sono costruiti (15 novembre 2026). Il link per il revisore sarà sul sito vero dopo il prossimo aggiornamento del server: chiedi a Giovanni prima di mostrarlo dal vivo a un cliente.</div>'));}},

'<div class="oneline">Prima: software house che costruiscono agenti AI in Python per finanza, assicurazioni e risorse umane, in Italia e Spagna.</div>'+
'<table class="t"><tr><th>Chi</th><th>Cosa li preoccupa</th><th>Piano</th></tr>'+

'<p style="margin-top:12px"><b>La porta migliore è la software house.</b> Una software house porta Sigillo a molti clienti finali e può rivenderlo dentro il suo prezzo ("ogni azione del nostro agente è sigillata e controllabile dal vostro revisore").</p>'+
'<p>Dimensione del mercato (stima): circa <b>250-500</b> aziende adatte in Italia e Spagna, <b>2.000-4.000</b> in tutta l\'UE.</p>'+
'<p class="small muted">Altre aziende con ricevute firmate per agenti: Elydora, Agnys, Sigill.ai. Non parlarne mai male.</p>'));}},

{ id:"laws", title:_("7. AI Act and eIDAS, simply","7. AI Act ed eIDAS, in parole semplici"), body:function(){ return t(_(
'<div class="oneline">Sigillo gives evidence for the law. It never makes anyone "compliant".</div>'+
'<h3>The AI Act</h3><p>The European law on AI. For "high-risk" uses (for example choosing job candidates, credit decisions, some insurance uses) it asks companies to <b>keep records</b> of what the AI does (Article 12) and to have <b>human oversight</b> (Article 14). Users of these systems have duties too (Article 26). Fines can reach €15 million or 3% of yearly turnover.</p>'+
'<p><b>Sigillo gives evidence</b> that helps with these records. Being compliant is a whole process of the client and its lawyers.</p>'+
'<div class="say"><b>Say it like this</b>"Sigillo doesn\'t make you compliant, no tool can. It gives you real evidence of what your agent did, which helps with the record-keeping the AI Act asks for."</div>'+
'<p class="small muted">Exact dates of the AI Act rules are changing; don\'t quote dates. If asked: "Your lawyer will know the dates for your case."</p>'+
'<h3>eIDAS and the time stamp</h3><p>eIDAS is the European law on electronic signatures and time stamps. A <b>"qualified"</b> time stamp, from an officially approved company, gets a legal presumption in the whole EU: a judge assumes the date and the content are correct unless someone proves the opposite.</p>'+
'<ul class="clean"><li><b>Today:</b> Sigillo\'s hourly time stamp comes from outside companies, but it is <b>not qualified</b>. It is still valid evidence, but a judge weighs it freely.</li>'+
'<li><b>Planned:</b> a qualified eIDAS stamp included in all paid plans (one per hour for all clients together). Not live yet. No date promised.</li></ul>'+
'<div class="say"><b>Say it like this</b>"Today our time stamp is from an outside company but not the qualified eIDAS kind; it is still evidence, but a judge weighs it. We plan to include the qualified one in the paid plans. I\'ll confirm the timing with our technical lead."</div>',
'<div class="oneline">Sigillo dà prove utili per la legge. Non rende mai nessuno "conforme".</div>'+
'<h3>L\'AI Act</h3><p>La legge europea sull\'intelligenza artificiale. Per gli usi "ad alto rischio" (per esempio scegliere candidati per un lavoro, decisioni di credito, alcuni usi assicurativi) chiede alle aziende di <b>tenere registrazioni</b> di quello che fa l\'AI (articolo 12) e di avere una <b>sorveglianza umana</b> (articolo 14). Anche chi usa questi sistemi ha dei doveri (articolo 26). Le multe arrivano a 15 milioni di euro o al 3% del fatturato annuo.</p>'+
'<p><b>Sigillo dà prove</b> che aiutano con queste registrazioni. Essere conformi è un percorso intero del cliente e dei suoi avvocati.</p>'+
'<div class="say"><b>Dillo così</b>"Sigillo non vi rende conformi, nessuno strumento può farlo. Vi dà prove vere di quello che ha fatto il vostro agente, che aiutano con le registrazioni che l\'AI Act chiede."</div>'+
'<p class="small muted">Le date esatte delle regole dell\'AI Act stanno cambiando; non citare date. Se te lo chiedono: "Il vostro avvocato saprà le date per il vostro caso."</p>'+
'<h3>eIDAS e la marca temporale</h3><p>eIDAS è la legge europea su firme e marche temporali elettroniche. Una marca <b>"qualificata"</b>, di un\'azienda approvata ufficialmente, ha una presunzione legale in tutta l\'UE: il giudice considera giusti data e contenuto, salvo prova contraria.</p>'+
'<ul class="clean"><li><b>Oggi:</b> la marca oraria di Sigillo viene da aziende esterne, ma <b>non è qualificata</b>. È comunque una prova valida, che il giudice valuta liberamente.</li>'+
'<li><b>Previsto:</b> una marca qualificata eIDAS inclusa in tutti i piani a pagamento (una all\'ora per tutti i clienti insieme). Non ancora attiva. Nessuna data promessa.</li></ul>'+
'<div class="say"><b>Dillo così</b>"Oggi la nostra marca temporale viene da un\'azienda esterna ma non è di tipo qualificato eIDAS; è comunque una prova, che il giudice valuta. Prevediamo di includere quella qualificata nei piani a pagamento. Confermo i tempi con il nostro responsabile tecnico."</div>'));}},

{ id:"words", title:_("8. Words, and when to say \"I'll check\"","8. Parole, e quando dire \"verifico\""), body:function(){
  return '<div class="oneline">'+t(_("Some words are forbidden, because they promise too much.","Alcune parole sono vietate, perché promettono troppo."))+'</div>'+ wordsHTML() + t(_(
'<h3 style="margin-top:16px">When you don\'t know</h3><p>You are not expected to know everything. Say: <b>"Good question. I\'ll check with our technical lead and get back to you by tomorrow."</b> Then write it down and ask Giovanni.</p>'+
'<p><b>Always pass to Giovanni:</b></p><ul class="clean"><li>Contract terms, DPA details, legal questions</li><li>Any discount other than "yearly = 2 months free"</li><li>Dates for new features (qualified eIDAS stamp, other languages)</li><li>Deep technical questions (security tests, installation on their own servers)</li><li>Anything you are not sure about</li></ul>'+
'<div class="never"><b>Never</b>Invent an answer to look smart. One invented answer can cost the whole client.</div>',
'<h3 style="margin-top:16px">Quando non sai</h3><p>Nessuno si aspetta che tu sappia tutto. Di\': <b>"Bella domanda. Verifico con il nostro responsabile tecnico e vi rispondo entro domani."</b> Poi segnatelo e chiedi a Giovanni.</p>'+
'<p><b>Passa sempre a Giovanni:</b></p><ul class="clean"><li>Condizioni del contratto, dettagli del DPA, domande legali</li><li>Qualsiasi sconto diverso da "annuale = 2 mesi gratis"</li><li>Date di nuove funzioni (marca qualificata eIDAS, altri linguaggi)</li><li>Domande tecniche profonde (test di sicurezza, installazione sui loro server)</li><li>Tutto ciò di cui non sei sicura</li></ul>'+
'<div class="never"><b>Mai</b>Inventare una risposta per sembrare brava. Una risposta inventata può costare tutto il cliente.</div>'));}},

{ id:"call", title:_("9. A good sales call in 5 steps","9. Una buona chiamata in 5 passi"), body:function(){ return t(_(
'<div class="oneline">Listen first, explain simply, say the limits, propose one small next step.</div>'+
'<ol class="clean"><li><b>Open (1 min).</b> Thank them, say who you are, ask how much time they have.</li>'+
'<li><b>Ask (5 min).</b> "What do your agents do? For which clients? Has anyone ever asked you to prove what the AI did?" Listen for their fear.</li>'+
'<li><b>Explain (3 min).</b> The one sentence, then the 4 steps. Connect it to their fear.</li>'+
'<li><b>Answer objections (5 min).</b> Agree with what is true, say the limit, then the value. Use the cheat sheet.</li>'+
'<li><b>Next step (1 min).</b> Ask for <b>one small, concrete step with a date</b>: start the free trial and a 20-minute connection call; or a pilot of 2-3 months for insurers and banks.</li></ol>'+
'<div class="say"><b>Good closing sentences</b>"Shall we start the free trial on one agent this week? We connect it together in 20 minutes."<br>"For an insurer, I suggest a 3-month pilot on one agent. At the end, your auditor tries the proof."</div>'+
'<div class="never"><b>Avoid</b>Pressure ("sign today or the price goes up"), invented urgency, big discounts on the first call, "I\'ll send material" without a date.</div>'+
'<h3>Glossary</h3><dl class="gloss"><dt>Agent</dt><dd>A program that uses AI to do jobs by itself.</dd><dt>Record / receipt</dt><dd>One sealed line of the diary: one action of the agent.</dd><dt>Fingerprint</dt><dd>A 64-character code made from a text or file. Proves it without showing it.</dd><dt>Time stamp</dt><dd>An outside company\'s proof that something existed at a given hour.</dd><dt>Proof file (evidence pack)</dt><dd>A downloadable file with the records, seals and a PDF report.</dd><dt>Verifier</dt><dd>The free program the auditor uses to check the proof file, without trusting us.</dd><dt>Auditor / reviewer</dt><dd>The outside person who checks: an auditor, a regulator, a lawyer, an expert.</dd><dt>DPA</dt><dd>Data Processing Agreement: the GDPR contract about personal data.</dd><dt>SLA</dt><dd>Service Level Agreement: promises about availability and support.</dd></dl>',
'<div class="oneline">Prima ascolta, spiega semplice, di\' i limiti, proponi un piccolo passo concreto.</div>'+
'<ol class="clean"><li><b>Apertura (1 min).</b> Ringrazia, di\' chi sei, chiedi quanto tempo hanno.</li>'+
'<li><b>Domande (5 min).</b> "Cosa fanno i vostri agenti? Per quali clienti? Qualcuno vi ha mai chiesto di provare cosa ha fatto l\'AI?" Ascolta la loro paura.</li>'+
'<li><b>Spiegazione (3 min).</b> La frase unica, poi i 4 passi. Collegali alla loro paura.</li>'+
'<li><b>Obiezioni (5 min).</b> Dai ragione su ciò che è vero, di\' il limite, poi il valore. Usa la scheda obiezioni.</li>'+
'<li><b>Passo successivo (1 min).</b> Chiedi <b>un passo piccolo e concreto, con una data</b>: iniziare la prova gratuita con una chiamata di collegamento di 20 minuti; o un progetto pilota di 2-3 mesi per assicurazioni e banche.</li></ol>'+
'<div class="say"><b>Buone frasi di chiusura</b>"Iniziamo la prova gratuita su un agente questa settimana? Lo colleghiamo insieme in 20 minuti."<br>"Per un\'assicurazione propongo un pilota di 3 mesi su un agente. Alla fine il vostro revisore prova la prova."</div>'+
'<div class="never"><b>Evita</b>La pressione ("firmate oggi o il prezzo sale"), l\'urgenza inventata, sconti grandi alla prima chiamata, "vi mando del materiale" senza una data.</div>'+
'<h3>Glossario</h3><dl class="gloss"><dt>Agente</dt><dd>Un programma che usa l\'AI per fare lavori da solo.</dd><dt>Ricevuta</dt><dd>Una riga sigillata del diario: un\'azione dell\'agente.</dd><dt>Impronta</dt><dd>Un codice di 64 caratteri ricavato da un testo o da un file. Lo prova senza mostrarlo.</dd><dt>Marca temporale</dt><dd>La prova di un\'azienda esterna che qualcosa esisteva a una certa ora.</dd><dt>Fascicolo delle prove</dt><dd>Un file da scaricare con le ricevute, i sigilli e un rapporto PDF.</dd><dt>Verificatore</dt><dd>Il programma gratuito con cui il revisore controlla il fascicolo, senza fidarsi di noi.</dd><dt>Revisore</dt><dd>La persona esterna che controlla: un auditor, un\'autorità, un avvocato, un perito.</dd><dt>DPA</dt><dd>Accordo sul trattamento dei dati: il contratto GDPR sui dati personali.</dd><dt>SLA</dt><dd>Accordo sul livello di servizio: promesse su disponibilità e assistenza.</dd></dl>'));}}
];

  { say:_("Hi! So, a client asked us: \"Is your CV screening AI Act compliant?\" and I panicked. Can Sigillo make us compliant?","Ciao! Allora, un cliente ci ha chiesto: \"La vostra selezione dei CV è conforme all'AI Act?\" e sono andata nel panico. Sigillo ci può rendere conformi?"),

  { id:"lucia_fine", branch:true,

  { say:_("Our agent reads CVs. Those are personal data! Do you see the CVs? Where is the data?","Il nostro agente legge i CV. Sono dati personali! Voi vedete i CV? Dove sono i dati?"),

        13,"Clear and simple, and the EU server matters for GDPR.","Chiara e semplice, e il server nell'UE conta per il GDPR.",

      O("A well-built AI doesn't make wrong decisions.","Un'AI fatta bene non sbaglia.",

        "Mine does sometimes, believe me.","La mia a volte sbaglia, credimi.")
    ]},
  { say:_("My clients might not want to pay extra for this. Why should they care?","I miei clienti potrebbero non voler pagare di più per questo. Perché dovrebbe interessargli?"),
    tip:_("Help her sell to HER clients: a selling point in her offer.","Aiutala a vendere ai SUOI clienti: un argomento in più nella sua offerta."),
    opts:[
      O("Make it a plus in your offer: \"every decision of our agent is recorded and can be checked by your auditor.\" HR buyers worry about complaints and audits. Some companies add €30-50 a month to their price for it.",
        "Fatene un punto forte dell'offerta: \"ogni decisione del nostro agente è registrata e controllabile dal vostro revisore.\" Chi compra per l'HR teme reclami e audit. Alcune aziende aggiungono 30-50 € al mese al loro prezzo.",
        12,"You help her sell to her own clients: the strongest reason to buy.","La aiuti a vendere ai suoi clienti: il motivo più forte per comprare.",
        "Ooh, that's a good line for my next pitch.","Ooh, è una bella frase per la mia prossima presentazione."),
      O("They'll care when the regulator knocks on the door.","Gli interesserà quando arriva l'autorità a bussare.",
        3,"A bit of fear-selling. Better to show a positive: a selling point for her offer.","Un po' di vendita con la paura. Meglio un lato positivo: un argomento per la sua offerta.",
        "Hm, maybe.","Mmh, può darsi."),
      O("You don't need to tell them about it.","Non serve che glielo diciate.",
        -6,"Misses the point: the record is valuable because her client can check it.","Non hai capito il punto: il registro vale perché il suo cliente lo può controllare.",
        "Then what's the point?","E allora a cosa serve?")
    ]},
  { hardOnly:true,
    say:_("One more. A candidate says our AI lied about why they were rejected. Can Sigillo prove what the AI really said?","Un'altra cosa. Un candidato dice che la nostra AI ha mentito sul perché è stato scartato. Sigillo può provare cosa ha detto davvero l'AI?"),
    tip:_("It proves WHAT was said, not whether it was true.","Prova COSA è stato detto, non se era vero."),
    opts:[
      O("Sigillo proves what the agent said and when: the fingerprint of the answer is in the sealed diary, and with your key you can show a text is exactly the one the agent produced. It doesn't judge if the answer was true or fair; people do that.",
        "Sigillo prova cosa ha detto l'agente e quando: l'impronta della risposta è nel diario sigillato, e con la vostra chiave potete mostrare che un testo è proprio quello prodotto dall'agente. Non giudica se la risposta era vera o giusta; quello lo fanno le persone.",
        12,"Precise: it proves what was said, not whether it was true.","Precisa: prova cosa è stato detto, non se era vero.",
        "That's exactly what I'd need in a dispute.","È proprio quello che mi servirebbe in una contestazione."),
      O("Yes, Sigillo proves the AI told the truth.","Sì, Sigillo prova che l'AI ha detto la verità.",
        -13,"Sigillo never checks truth. It proves what was said, not if it was right.","Sigillo non controlla mai la verità. Prova cosa è stato detto, non se era giusto.",
        "Really? How?","Davvero? Come?", {red:true}),
      O("Sigillo keeps all the texts, so yes.","Sigillo tiene tutti i testi, quindi sì.",
        -5,"Careful: it keeps fingerprints, not texts. With her key she can match a text to its fingerprint.","Attenzione: tiene impronte, non testi. Con la sua chiave può abbinare un testo alla sua impronta.",
        "Wait, you said you don't keep texts…","Aspetta, avevi detto che non tenete i testi…")
    ]},
  { closing:true,
    say:_("OK, I like it! What now?","Ok, mi piace! E adesso?"),
    tip:_("She's ready. Propose a free, concrete first step with a date.","È pronta. Proponi un primo passo gratuito e concreto, con una data."),
    opts:[
      O("Start the free trial today: I'll send you the link, and we connect your agent together in a 20-minute call this week.","Inizia la prova gratuita oggi: ti mando il link e colleghiamo il tuo agente insieme in una chiamata di 20 minuti questa settimana.",
        8,"She's ready; a free, immediate start with a date.","È pronta; un inizio gratuito e immediato, con una data.",
        "Deal! Send me the link.","Affare fatto! Mandami il link.", {c:"ask"}),
      O("Pay the yearly Starter now, €490, and you're covered.","Paga ora lo Starter annuale, 490 €, e sei a posto.",
        -8,"She just said money is tight. Let her try first.","Ha appena detto che i soldi sono pochi. Lasciala provare prima.",
        "Hm, I'd rather not pay before trying.","Mmh, preferirei non pagare prima di provare.", {c:"push"}),
      O("Think about it and write to me.","Pensaci e scrivimi.",

{ id:"marco", name:"Marco Bellini", initials:"MB", color:"#1565c0", stars:2, adj:0, flag:"🇮🇹",
  role:_("CTO, Nexa Software (25 people), Milan","CTO, Nexa Software (25 persone), Milano"),
  icp:_("Software house · agents for insurers","Software house · agenti per assicurazioni"),
  plan:_("Professional €149 (5 agents)","Professionale 149 € (5 agenti)"),
  personality:_("Practical, busy, a bit technical. Hates hype and buzzwords.","Pratico, sempre di corsa, un po' tecnico. Odia le mode e le parole vuote."),
  fears:_("Extra work for his developers, slowing down the agents, one more tool to maintain.","Lavoro in più per gli sviluppatori, agenti più lenti, un altro strumento da mantenere."),
  wants:_("Something his insurer clients will value, and an argument to win tenders.","Qualcosa che i suoi clienti assicurativi apprezzino, e un argomento per vincere le gare."),
  intro:_("Marco accepted a 20-minute video call after your LinkedIn message. His company builds AI agents that help insurers handle claims. Coffee in hand, he keeps looking at the clock.",
          "Marco ha accettato una videochiamata di 20 minuti dopo il tuo messaggio su LinkedIn. La sua azienda costruisce agenti AI che aiutano le assicurazioni a gestire i sinistri. Caffè in mano, guarda spesso l'orologio."),
  outcomes:{ sale:_("Marco starts the free trial on one agent and plans Professional (€149/month) for all five.","Marco inizia la prova gratuita su un agente e prevede il Professionale (149 €/mese) per tutti e cinque."),
             demo:_("Marco agrees to a demo next week, but hasn't committed.","Marco accetta una demo la settimana prossima, ma non si è impegnato."),
             lost:_("Marco says \"not now\" and ends the call five minutes early.","Marco dice \"non adesso\" e chiude la chiamata cinque minuti prima.") },
  lesson:_("Busy technical people want concrete numbers (3 lines, 20 minutes, €30 per agent) and respect for the tools they already use.","Le persone tecniche e di fretta vogliono numeri concreti (3 righe, 20 minuti, 30 € ad agente) e rispetto per gli strumenti che già usano."),
  nodes:[
  { say:_("OK, I have 20 minutes. What is Sigillo, in simple words?","Ok, ho 20 minuti. Cos'è Sigillo, in parole semplici?"),
    tip:_("Use the one-sentence pitch. Short, concrete, no buzzwords.","Usa la frase unica. Breve, concreta, senza parole vuote."),
    opts:[
      O("Sigillo is a sealed diary for your AI agents. It records what each agent does, and any auditor can check that nobody changed it, not even us. Your insurer clients get proof, without us ever reading their data.",
        "Sigillo è un diario sigillato per i vostri agenti AI. Registra cosa fa ogni agente, e qualsiasi revisore può controllare che nessuno l'abbia cambiato, nemmeno noi. I vostri clienti assicurativi hanno una prova, senza che noi leggiamo mai i loro dati.",
        12,"Short, concrete, and it names the benefit for HIS clients.","Breve, concreta, e nomina il vantaggio per i SUOI clienti.",
        "Hm. A sealed diary. OK, go on.","Mmh. Un diario sigillato. Ok, vai avanti."),
      O("We're an AI governance and trust platform using cryptographic hash chains and Merkle trees.","Siamo una piattaforma di governance e fiducia per l'AI con catene di hash crittografiche e alberi di Merkle.",
        -6,"Buzzwords. Marco hates hype, and you can't explain Merkle trees if he asks.","Parole vuote. Marco odia le mode, e non sapresti spiegare gli alberi di Merkle se te lo chiede.",
        "That sounds like every startup deck I get.","Sembra ogni presentazione di start-up che ricevo."),
      O("Sigillo makes your agents AI Act compliant and tamper-proof.","Sigillo rende i vostri agenti conformi all'AI Act e tamper-proof.",
        -14,"Two forbidden words: \"compliant\" and \"tamper-proof\". Sigillo gives evidence; it shows changes, it doesn't prevent them.","Due parole vietate: \"conforme\" e \"tamper-proof\". Sigillo dà prove; mostra le modifiche, non le impedisce.",
        "Compliant? Nobody can promise that.","Conformi? Nessuno può prometterlo.", {red:true}),
      O("It's a tool that keeps a record of what AI agents do, for audits.","È uno strumento che tiene un registro di cosa fanno gli agenti AI, per gli audit.",
        5,"Correct but flat. Add the key point: nobody can change it secretly, and an auditor can check without trusting you.","Giusto ma piatto. Aggiungi il punto chiave: nessuno lo può cambiare di nascosto, e un revisore controlla senza fidarsi.",
        "Like a log? We have logs.","Come un log? I log li abbiamo.")
    ]},
  { say:_("We already have logs. Datadog, our database, everything. Why would I pay for this?","Abbiamo già i log. Datadog, il nostro database, tutto. Perché dovrei pagare per questo?"),
    tip:_("Logs can be edited by whoever runs the server. Sigillo's diary shows any change, and outsiders can check it.","I log li può modificare chi gestisce il server. Il diario di Sigillo mostra ogni modifica, e chi sta fuori lo può controllare."),
    opts:[
      O("Your logs are great for your team. But an auditor has to trust you, because whoever runs the server can edit them. With Sigillo every line is sealed and time-stamped by an outside company, so the auditor can check it alone, without trusting you or us.",
        "I vostri log vanno benissimo per il team. Ma un revisore deve fidarsi di voi, perché chi gestisce il server li può modificare. Con Sigillo ogni riga è sigillata e timbrata da un'azienda esterna, quindi il revisore controlla da solo, senza fidarsi né di voi né di noi.",
        13,"You respect his tools and explain the one difference that matters: proof for someone outside.","Rispetti i suoi strumenti e spieghi l'unica differenza che conta: la prova per chi sta fuori.",
        "So the point is the auditor, not my team. OK, fair.","Quindi il punto è il revisore, non il mio team. Ok, giusto."),
      O("Logs are old technology. Sigillo is much better.","I log sono tecnologia vecchia. Sigillo è molto meglio.",
        -6,"Never attack what the client uses. Logs are for debugging; Sigillo is for proof. Different jobs.","Non attaccare mai quello che usa il cliente. I log servono a trovare errori; Sigillo serve a provare. Lavori diversi.",
        "Our logs work fine, thanks.","I nostri log funzionano benissimo, grazie."),
      O("Logs can be hacked easily. Sigillo can never be hacked.","I log si violano facilmente. Sigillo non si può mai violare.",
        -14,"\"Never hacked\" is an overpromise. Sigillo shows changes; it doesn't promise nothing can ever go wrong.","\"Mai violato\" è una promessa eccessiva. Sigillo mostra le modifiche; non promette che niente possa mai andare storto.",
        "Never? Every security person knows that's not true.","Mai? Chiunque si occupi di sicurezza sa che non è vero.", {red:true}),
      O("Logs don't have a time stamp from an outside company.","I log non hanno una marca temporale di un'azienda esterna.",
        4,"True, but half the story. Say who benefits: the auditor or the insurer can check alone.","Vero, ma è metà della storia. Di' chi ci guadagna: il revisore o l'assicurazione controllano da soli.",
        "And why would I need that?","E perché mi servirebbe?")
    ]},
  { say:_("How much work is it for my developers? They're already overloaded.","Quanto lavoro è per i miei sviluppatori? Sono già sommersi."),
    tip:_("3 lines of Python, 20-minute call together. Python only, today.","3 righe di Python, chiamata di 20 minuti insieme. Oggi solo Python."),
    opts:[
      O("For a Python agent it's three lines at the top of the file. We do the first connection together in a 20-minute call. After that it runs by itself.",
        "Per un agente Python sono tre righe in cima al file. Il primo collegamento lo facciamo insieme in una chiamata di 20 minuti. Poi va da solo.",
        12,"Concrete numbers kill the fear of extra work.","I numeri concreti tolgono la paura del lavoro in più.",
        "Three lines I can live with. We're all Python anyway.","Tre righe le posso accettare. Tanto usiamo tutti Python."),
      O("Very little, it's easy.","Pochissimo, è facile.",
        3,"Too vague. Give the number: three lines, 20-minute call.","Troppo vago. Di' il numero: tre righe, chiamata di 20 minuti.",
        "Everyone says that.","Lo dicono tutti."),
      O("Zero work: it works automatically with any agent in any language.","Zero lavoro: funziona da solo con qualsiasi agente in qualsiasi linguaggio.",
        -12,"Not true: today it's for Python agents. When he finds out, you lose him for good.","Non è vero: oggi è per agenti Python. Quando lo scopre, lo perdi per sempre.",
        "Any language? Our Java team will be happy…","Qualsiasi linguaggio? Il nostro team Java sarà contento…", {red:true}),
      O("I'm not technical, I don't know.","Non sono tecnica, non lo so.",
        -4,"Honesty is good, but you know this one: three lines of Python. Save \"I'll check\" for really technical questions.","L'onestà va bene, ma questa la sai: tre righe di Python. Tieni il \"verifico\" per le domande davvero tecniche.",
        "Hm. Who should I talk to, then?","Mmh. Con chi devo parlare, allora?")
    ]},
  { say:_("Will it slow down the agents? And if your server goes down, do my agents stop?","Rallenta gli agenti? E se il vostro server si ferma, i miei agenti si bloccano?"),
    tip:_("Never stops the agent. Records catch up after an outage, nothing lost.","Non ferma mai l'agente. Dopo un'interruzione le ricevute si rimettono in pari, niente perso."),
    opts:[
      O("No. Sigillo never stops your agent. If the internet or our server goes down, the agent keeps working and the diary catches up by itself when the connection is back. Nothing is lost.",
        "No. Sigillo non ferma mai il vostro agente. Se cade internet o il nostro server, l'agente continua a lavorare e il diario si rimette in pari da solo quando torna la connessione. Non si perde niente.",
        12,"Exactly what the product does, in his language.","Esattamente quello che fa il prodotto, nella sua lingua.",
        "Good. That was my main worry.","Bene. Era la mia preoccupazione principale."),
      O("Our server never goes down.","Il nostro server non si ferma mai.",
        -7,"No one can promise that. The strong honest answer: even if it does, nothing is lost and the agent keeps running.","Nessuno può prometterlo. La risposta onesta e forte: anche se succede, non si perde niente e l'agente continua.",
        "Every server goes down sometimes.","Ogni server prima o poi si ferma."),
      O("It's very fast, don't worry.","È velocissimo, tranquillo.",
        3,"\"Don't worry\" doesn't answer. Explain: the agent is never stopped, records catch up after an outage.","\"Tranquillo\" non è una risposta. Spiega: l'agente non si ferma mai, le ricevute si rimettono in pari.",
        "And if you're down?","E se siete giù?"),
      O("If our server is down, the agent pauses to keep the record complete.","Se il nostro server è giù, l'agente si mette in pausa per tenere il registro completo.",
        -11,"False. Sigillo never stops the agent. Wrong facts scare clients away for no reason.","Falso. Sigillo non ferma mai l'agente. I fatti sbagliati fanno scappare i clienti senza motivo.",
        "Pauses? Then no way.","In pausa? Allora no.")
    ]},
  { say:_("My client is an insurer. If something goes wrong with a claim, how does their auditor actually see the proof?","Il mio cliente è un'assicurazione. Se qualcosa va storto su un sinistro, il loro revisore come vede la prova?"),
    tip:_("Reviewer link: \"Verify here\" and \"Download\". Program fingerprint without showing code.","Link per il revisore: \"Verifica qui\" e \"Scarica\". Impronta del programma senza mostrare il codice."),
    opts:[
      O("You press \"Share with reviewer\", pick the agent and the dates, and send a link. The auditor opens a Sigillo page: \"Verify here\" checks it in the browser, \"Download\" gives the proof file for our free verifier. It also shows which version of the agent program wrote the diary, with a fingerprint, without showing your code.",
        "Premete \"Condividi con il revisore\", scegliete agente e date, e mandate un link. Il revisore apre una pagina di Sigillo: \"Verifica qui\" controlla nel browser, \"Scarica\" dà il fascicolo per il nostro verificatore gratuito. Mostra anche quale versione del programma ha scritto il diario, con un'impronta, senza mostrare il vostro codice.",
        14,"A concrete story of what the auditor sees. The fingerprint answers \"which agent\" without exposing his code.","Una storia concreta di cosa vede il revisore. L'impronta risponde a \"quale agente\" senza esporre il suo codice.",
        "Without showing our code… that's important. Our code is our value.","Senza mostrare il nostro codice… questo è importante. Il codice è il nostro valore."),
      O("They get a zip file with a PDF report.","Ricevono un file zip con un rapporto PDF.",
        5,"True (the proof file), but the reviewer link is stronger: the auditor gets the proof straight from Sigillo.","Vero (il fascicolo), ma il link per il revisore è più forte: il revisore riceve la prova direttamente da Sigillo.",
        "OK. And they trust a zip I send them?","Ok. E si fidano di uno zip che mando io?"),
      O("They log into your account and look around.","Entrano nel vostro account e guardano.",
        -6,"No. The auditor never gets account access. The link is read-only, one agent, one period, expires in 30 days.","No. Il revisore non entra mai nell'account. Il link è solo lettura, un agente, un periodo, scade in 30 giorni.",
        "Into my account? No thanks.","Nel mio account? No grazie."),
      O("The auditor can read every prompt and answer of the agent.","Il revisore può leggere ogni domanda e risposta dell'agente.",
        -12,"Wrong and dangerous: Sigillo never stores texts, only fingerprints.","Sbagliato e pericoloso: Sigillo non salva mai i testi, solo le impronte.",
        "So you DO store our clients' texts?","Quindi i testi dei clienti li salvate?", {red:true})
    ]},
  { say:_("OK. What does it cost? We have about 5 agents running for clients.","Ok. Quanto costa? Abbiamo circa 5 agenti attivi per i clienti."),
    tip:_("5 agents → Professional €149, about €30 per agent. Yearly: 2 months free.","5 agenti → Professionale 149 €, circa 30 € ad agente. Annuale: 2 mesi gratis."),
    opts:[
      O("Professional fits you: €149 a month for up to 5 agents, about €30 per agent, easy to include in your price to the insurer. Yearly, you get 2 months free. And you can start with the free trial on one agent.",
        "Per voi va il Professionale: 149 € al mese fino a 5 agenti, circa 30 € ad agente, facile da mettere nel prezzo all'assicurazione. Annuale, 2 mesi gratis. E potete partire con la prova gratuita su un agente.",
        12,"Right plan, per-agent math, and the idea of passing the cost to his client.","Piano giusto, conto per agente, e l'idea di girare il costo al suo cliente.",
        "€30 per agent… I can put that in the next offer.","30 € ad agente… lo posso mettere nella prossima offerta."),
      O("It depends, let me send you a quote.","Dipende, ti mando un preventivo.",
        -5,"Prices are simple and public. Hiding them sounds expensive.","I prezzi sono semplici e pubblici. Nasconderli fa sembrare tutto caro.",
        "Uh-oh, \"it depends\" usually means expensive.","Uh, \"dipende\" di solito vuol dire caro."),
      O("Starter is €49 a month.","Lo Starter costa 49 € al mese.",
        4,"Starter covers 1 agent. He has 5: Professional is right. Wrong plan → surprise later.","Lo Starter copre 1 agente. Lui ne ha 5: è giusto il Professionale. Piano sbagliato → sorpresa dopo.",
        "For all five?","Per tutti e cinque?"),
      O("For you, 50% off forever if you sign today.","Per voi, 50% di sconto per sempre se firmate oggi.",
        -10,"No big discounts on a first call, no pressure. Yearly (2 months free) is the only standard discount; anything else, ask Giovanni.","Niente sconti grandi alla prima chiamata, niente pressione. L'annuale (2 mesi gratis) è l'unico sconto standard; altro, chiedi a Giovanni.",
        "Sign today? I haven't even tried it.","Firmare oggi? Non l'ho nemmeno provato.")
    ]},
  { hardOnly:true,
    say:_("Last thing. If one of my developers removes your three lines, does Sigillo notice?","Ultima cosa. Se uno dei miei sviluppatori toglie le vostre tre righe, Sigillo se ne accorge?"),
    tip:_("Say the limit first, then what we DO see: silence and code changes.","Prima il limite, poi cosa vediamo: il silenzio e i cambi di codice."),
    opts:[
      O("Sigillo can't force anyone to keep recording, and I won't pretend it can. But we see when an agent goes silent, and every time the program changes, its new fingerprint goes in the diary. So a gap is visible, not hidden.",
        "Sigillo non può obbligare nessuno a registrare, e non farò finta che possa. Ma vediamo quando un agente tace, e ogni volta che il programma cambia, la nuova impronta entra nel diario. Quindi un buco si vede, non resta nascosto.",
        13,"Honest limit + what you DO see. Hard clients trust you more when you say the limit first.","Limite onesto + cosa vedi. I clienti duri si fidano di più quando dici prima il limite.",
        "Fair answer. Most vendors would just say \"impossible\".","Risposta onesta. Quasi tutti direbbero \"impossibile\"."),
      O("No, it's impossible to remove.","No, è impossibile toglierlo.",
        -15,"False. Anyone who controls the code can remove it. If he tests it, you're finished.","Falso. Chiunque controlli il codice lo può togliere. Se lo prova, sei finita.",
        "Impossible? It's three lines in MY code.","Impossibile? Sono tre righe nel MIO codice.", {red:true}),
      O("Why would they do that?","Perché dovrebbero farlo?",
        3,"Dodges the question. Answer it.","Eviti la domanda. Rispondi.",
        "Humour me.","Fammi contento."),
      O("I'll ask our tech team.","Chiedo al nostro team tecnico.",
        -4,"You know this: we see when an agent goes silent and when its code changes.","Questa la sai: vediamo quando un agente tace e quando il suo codice cambia.",
        "OK.","Ok.")
    ]},
  { closing:true,
    say:_("Alright. What do you suggest as a next step?","Va bene. Cosa proponi come passo successivo?"),
    tip:_("A small, concrete step with a date: free trial on one agent + 20-minute call.","Un passo piccolo e concreto con una data: prova gratuita su un agente + chiamata di 20 minuti."),
    opts:[
      O("Let's start the free trial on one of your agents this week; we connect it together in a 20-minute call. If your team likes it, you move to Professional for all five.",
        "Partiamo con la prova gratuita su uno dei vostri agenti questa settimana; lo colleghiamo insieme in 20 minuti. Se al team piace, passate al Professionale per tutti e cinque.",
        8,"Small, concrete, low-risk, with a clear path to the paid plan.","Piccolo, concreto, a basso rischio, con una strada chiara verso il piano a pagamento.",
        "OK. Thursday at 10?","Ok. Giovedì alle 10?", {c:"ask"}),
      O("Sign the yearly Professional plan today, so you get the discount.","Firmate oggi il Professionale annuale, così avete lo sconto.",
        -10,"Too fast. He hasn't tried it. Pressure makes careful buyers walk away.","Troppo presto. Non l'ha provato. La pressione fa scappare i clienti prudenti.",
        "Today? No.","Oggi? No.", {c:"push"}),
      O("I'll send you some material, have a look when you have time.","Ti mando del materiale, guardalo quando hai tempo.",
        2,"Polite but no next step. Material without a date usually means no answer.","Gentile ma senza passo successivo. Materiale senza data di solito vuol dire nessuna risposta.",
        "Sure, send it.","Certo, mandalo.", {c:"soft"}),
      O("Let's book a demo with our technical lead next week.","Fissiamo una demo con il nostro responsabile tecnico la settimana prossima.",
        5,"Good step, but he may be ready for the trial already. Ask for it.","Buon passo, ma forse è già pronto per la prova. Chiedila.",
        "OK, send me a slot.","Ok, mandami un orario.", {c:"soft"})
    ]}
  ]},
